spring:
  application:
    name: baduk-analyzer
  thymeleaf:
    cache: false
  # 구글 OAuth 키 파일(프로젝트 루트 google-oauth.properties). 없으면 무시(데모 로그인).
  # google-oauth.properties.example 를 복사해 GOOGLE_CLIENT_ID/SECRET 채우고 재시작하면 실연동.
  config:
    import: "optional:file:./google-oauth.properties"

server:
  port: 8083

katago:
  path: C:/KataGo/katago-v1.16.5-opencl-windows-x64/katago.exe
  model: C:/KataGo/models/kata1-b28c512nbt-s13255194368-d5935380940.bin.gz
  config: C:/KataGo/katago-v1.16.5-opencl-windows-x64/analysis_example.cfg
  record-dir: C:/KataGo/Baduk_Records
  result-dir: C:/KataGo/GameResults
  timeout-seconds: 300
  batch-analysis-enabled: false
  # 단일 기보 분석의 수당 탐색량. 낮으면 빠르지만 전투 국면 형세가 부정확
  # (200=빠름·기본, 1000=양호, 5000=방송 수준 정확하나 매우 느림). 변경 후 서버 재시작 필요.
  analysis-visits: 200
  # 2차 정밀 분석 탐색량. 1차(analysis-visits)에서 실수·악수(집손해≥3)로 잡힌 국면만
  # 이 값으로 재분석 → 저visits 오판 교정. deep-visits ≤ analysis-visits면 2차 생략.
  deep-visits: 1500

tygem:
  gibo-dir: C:/Program Files (x86)/타이젬바둑 2.0/Gibo

# 구글 OAuth2 로그인. 환경변수 GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET 를 넣으면
# 구글 버튼이 실제 로그인으로 동작한다(둘 다 비어 있으면 데모 로그인으로 표시).
# 구글 클라우드 콘솔에서 승인 리디렉션 URI: http://localhost:8083/login/oauth2/code/google
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
