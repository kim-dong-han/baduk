<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  공용 상단 헤더(새 디자인). 스타일은 static/css/app-header.css.
  사용법: <header th:replace="~{fragments/appheader :: header('game')}"></header>
  active 키: home | game | notes | gallery | play | batch | about | study
-->
<body>

<header class="site-header" th:fragment="header(active)">
    <div class="header-inner">

        <a href="/" class="brand">
            <div class="brand-mark">碁</div>
            <div class="brand-info">
                <span class="brand-name">Baduk AI</span>
                <span class="brand-subtitle">AI 바둑 분석 플랫폼</span>
            </div>
        </a>

        <nav class="main-nav">
            <a href="/" class="nav-link" th:classappend="${active == 'home'} ? ' active'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 11.5L12 4l9 7.5"></path>
                        <path d="M5 10.5V20h14v-9.5"></path>
                        <path d="M9 20v-5h6v5"></path>
                    </svg>
                </span>
                <span>홈</span>
            </a>

            <a href="/game" class="nav-link" th:classappend="${active == 'game'} ? ' active'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 5h14v14H5z"></path>
                        <circle cx="9" cy="9" r="1.5"></circle>
                        <circle cx="15" cy="15" r="1.5"></circle>
                        <path d="M10 10l4 4"></path>
                    </svg>
                </span>
                <span>기보 복기</span>
            </a>

            <a href="/notes" class="nav-link" th:classappend="${active == 'notes'} ? ' active'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 4h14v16H5z"></path>
                        <path d="M8 8h8"></path>
                        <path d="M8 12h6"></path>
                        <path d="M8 16h4"></path>
                    </svg>
                </span>
                <span>오답노트</span>
            </a>

            <a href="/gallery" class="nav-link" th:classappend="${active == 'gallery'} ? ' active'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                        <circle cx="8.5" cy="9" r="1.5"></circle>
                        <path d="M4 17l5-5 4 4 3-3 4 4"></path>
                    </svg>
                </span>
                <span>갤러리</span>
            </a>

            <!-- AI 대국 + 실시간 분석: 판 위에서 하는 일끼리 한 묶음(hover/focus 로 열림) -->
            <div class="nav-group">
                <a href="/play" class="nav-link"
                   th:classappend="${active == 'play' or active == 'study'} ? ' active'">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                             stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="14" rx="3"></rect>
                            <path d="M8 9v6"></path>
                            <path d="M5 12h6"></path>
                            <circle cx="16" cy="10" r="1"></circle>
                            <circle cx="18" cy="14" r="1"></circle>
                        </svg>
                    </span>
                    <span>AI 대국</span>
                    <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9l6 6 6-6"></path>
                    </svg>
                </a>

                <div class="nav-submenu">
                    <a href="/play" th:classappend="${active == 'play'} ? ' current'">
                        <strong>AI 대국</strong>
                        <span>KataGo 와 한 판 두기</span>
                    </a>
                    <a href="/study" th:classappend="${active == 'study'} ? ' current'">
                        <strong>실시간 분석</strong>
                        <span>놓아보며 형세·추천수 확인</span>
                    </a>
                </div>
            </div>

            <!-- 실력 리포트 + 기력 인증 + 성장률 리그: 내 실력을 재고 겨루는 일끼리 한 묶음 -->
            <div class="nav-group">
                <a href="/analysis/batch" class="nav-link"
                   th:classappend="${active == 'batch' or active == 'rating' or active == 'league'} ? ' active'">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19V5"></path>
                            <path d="M4 19h16"></path>
                            <path d="M7 15l3-4 3 2 5-7"></path>
                        </svg>
                    </span>
                    <span>실력 리포트</span>
                    <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9l6 6 6-6"></path>
                    </svg>
                </a>

                <div class="nav-submenu">
                    <a href="/analysis/batch" th:classappend="${active == 'batch'} ? ' current'">
                        <strong>실력 리포트</strong>
                        <span>내 기보 전체를 한눈에</span>
                    </a>
                    <a href="/rating" th:classappend="${active == 'rating'} ? ' current'">
                        <strong>기력 인증서</strong>
                        <span>여러 판 누적 기력과 구간별 약점</span>
                    </a>
                    <a href="/league" th:classappend="${active == 'league'} ? ' current'">
                        <strong>성장률 리그</strong>
                        <span>승패 아닌 개선폭으로 매기는 순위</span>
                    </a>
                </div>
            </div>

            <a href="/about" class="nav-link" th:classappend="${active == 'about'} ? ' active'">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 10v6"></path>
                        <path d="M12 7h.01"></path>
                    </svg>
                </span>
                <span>소개</span>
            </a>
        </nav>

        <div class="header-actions">

            <!-- 계정 메뉴: <details> 드롭다운 + 로그아웃 POST -->
            <details class="user-menu">
                <summary>
                    <span class="avatar">
                        <img th:if="${currentUserPicture != null}" th:src="${currentUserPicture}" alt="프로필">
                        <span th:unless="${currentUserPicture != null}" th:text="${currentUserInitial}">사</span>
                    </span>
                    <span class="user-info">
                        <span class="user-name" th:text="${currentUserName}">사용자</span>
                        <span class="user-email" th:if="${currentUserEmail != null}" th:text="${currentUserEmail}">-</span>
                    </span>
                    <svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.7" stroke-linecap="round">
                        <path d="M6 9l6 6 6-6"></path>
                    </svg>
                </summary>

                <div class="user-dropdown">
                    <div class="user-dropdown-head">
                        <div class="user-dropdown-name" th:text="${currentUserName}">사용자</div>
                        <div class="user-dropdown-email" th:if="${currentUserEmail != null}"
                             th:text="${currentUserEmail}">-</div>
                    </div>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="logout-button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 17l5-5-5-5"></path>
                                <path d="M20 12H9"></path>
                                <path d="M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"></path>
                            </svg>
                            로그아웃
                        </button>
                    </form>
                </div>
            </details>

            <button type="button" class="mobile-menu-button" id="mobileMenuButton" aria-label="메뉴">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M4 7h16"></path>
                    <path d="M4 12h16"></path>
                    <path d="M4 17h16"></path>
                </svg>
            </button>
        </div>

        <!-- 좁은 화면용 내비 -->
        <nav class="mobile-nav" id="mobileNav">
            <a href="/" th:classappend="${active == 'home'} ? 'active'">홈</a>
            <a href="/game" th:classappend="${active == 'game'} ? 'active'">기보 복기</a>
            <a href="/notes" th:classappend="${active == 'notes'} ? 'active'">오답노트</a>
            <a href="/gallery" th:classappend="${active == 'gallery'} ? 'active'">갤러리</a>
            <a href="/play" th:classappend="${active == 'play'} ? 'active'">AI 대국</a>
            <a href="/study" class="sub" th:classappend="${active == 'study'} ? ' active'">실시간 분석</a>
            <a href="/analysis/batch" th:classappend="${active == 'batch'} ? 'active'">실력 리포트</a>
            <a href="/about" th:classappend="${active == 'about'} ? 'active'">소개</a>
        </nav>

        <!-- 헤더 자체 동작(모바일 토글·바깥 클릭 시 계정 메뉴 닫기) -->
        <script th:inline="none">
            (function () {
                var btn = document.getElementById('mobileMenuButton');
                var nav = document.getElementById('mobileNav');
                if (btn && nav) btn.addEventListener('click', function () { nav.classList.toggle('open'); });
                document.addEventListener('click', function (e) {
                    document.querySelectorAll('details.user-menu[open]').forEach(function (d) {
                        if (!d.contains(e.target)) d.removeAttribute('open');
                    });
                });
            })();
        </script>

    </div>
</header>

</body>
</html>
