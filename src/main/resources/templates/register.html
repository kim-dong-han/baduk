<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 · 바둑 분석</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body { background:
            radial-gradient(1100px 620px at 12% -10%, #e7ecff 0%, transparent 55%),
            radial-gradient(1000px 720px at 112% 112%, #f0e9fe 0%, transparent 52%),
            var(--background); }
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .login-card {
            background: var(--surface); border-radius: var(--radius-lg); padding: 38px 34px; width: 100%; max-width: 400px;
            box-shadow: var(--shadow-lg), 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
        }
        .login-card .brand { font-size: 20px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.5px; }
        .login-card .sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; }
        .field-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 12px 2px 5px; display: block; }
        .field-label .opt { color: var(--text-muted); font-weight: 500; }
        .field {
            width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
            padding: 12px 14px; font-size: 14px; background: var(--surface-2);
            transition: border-color .15s, background .15s, box-shadow .15s;
        }
        .field:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
        .login-btn {
            width: 100%; border: none; border-radius: 11px; cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-blue)); color: #fff; font-size: 15px; font-weight: 700;
            padding: 14px 0; margin-top: 22px; transition: filter .15s, transform .05s, box-shadow .15s;
            box-shadow: 0 10px 22px -8px rgba(79,70,229,0.55);
        }
        .login-btn:hover { filter: brightness(1.06); }
        .login-btn:active { transform: translateY(1px); }
        .hint { font-size: 11px; color: var(--text-muted); margin: 5px 2px 0; }
        .alert-error { font-size: 13px; font-weight: 600; padding: 11px 13px; border-radius: 10px; margin-bottom: 14px; background: var(--danger-bg); color: #c0392b; border: 1px solid #f5c6cb; }
        .backlink { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-secondary); text-decoration: none; }
        .backlink:hover { color: var(--primary); }
        .backlink b { color: var(--primary); }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="brand">⚫ 회원가입</div>
        <div class="sub">바둑 복기 분석 계정을 만드세요.</div>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <label class="field-label">아이디</label>
            <input class="field" type="text" name="username" placeholder="영문·숫자 3자 이상"
                   th:value="${username}" autocomplete="username" required>
            <div class="hint">영문·숫자·_.- 사용, 3자 이상</div>

            <label class="field-label">비밀번호</label>
            <input class="field" type="password" name="password" placeholder="4자 이상" autocomplete="new-password" required>

            <label class="field-label">비밀번호 확인</label>
            <input class="field" type="password" name="passwordConfirm" placeholder="비밀번호 재입력" autocomplete="new-password" required>

            <label class="field-label">이메일 <span class="opt">(선택)</span></label>
            <input class="field" type="email" name="email" placeholder="example@email.com"
                   th:value="${email}" autocomplete="email">

            <label class="field-label">표시 이름 <span class="opt">(선택)</span></label>
            <input class="field" type="text" name="displayName" placeholder="비우면 아이디로 표시"
                   th:value="${displayName}" autocomplete="nickname">

            <button class="login-btn" type="submit">가입하기</button>
        </form>

        <a class="backlink" th:href="@{/login}">이미 계정이 있으신가요? <b>로그인</b></a>
    </div>
</div>
</body>
</html>
