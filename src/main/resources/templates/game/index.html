<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1판 복기 분석</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        /* h1, .subtitle 은 common.css 공통 규칙 사용 */
        .nav { margin-bottom: 20px; }
        .nav a { color: var(--primary); text-decoration: none; font-size: 14px; }

        .error-box { background: var(--danger-bg); border: 1px solid #f3b6b6; color: #c0392b; padding: 14px 18px; border-radius: var(--radius-sm); margin-bottom: 20px; max-width: 680px; font-size: 14px; }

        /* ── 탭 파일 선택 박스 ── */
        .select-box { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }

        .tabs { display: flex; border-bottom: 2px solid var(--border); background: transparent; padding: 0; border-radius: 0; }
        .tab { flex: 1; padding: 15px 0; text-align: center; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s; user-select: none; background: transparent; border-radius: 0; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: transparent; box-shadow: none; }
        .tab:hover:not(.active) { color: var(--text-secondary); background: var(--surface-2); }
        .tab-count { font-size: 11px; font-weight: 600; background: var(--surface-2); border-radius: var(--radius-pill); padding: 1px 7px; margin-left: 6px; color: var(--text-muted); }
        .tab.active .tab-count { background: var(--primary-light); color: var(--primary); }

        .file-list { max-height: 360px; overflow-y: auto; padding: 8px 0; }
        .file-list::-webkit-scrollbar { width: 5px; }
        .file-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

        .file-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--surface-2); transition: background 0.1s; }
        .file-item:hover { background: var(--surface-2); }
        .file-item.selected { background: var(--primary-light); border-left: 3px solid var(--primary); padding-left: 17px; }
        .file-item:last-child { border-bottom: none; }

        .file-icon { font-size: 16px; flex-shrink: 0; opacity: 0.6; }
        .file-name { font-size: 14px; color: var(--text-primary); flex: 1; }
        .analyzed-badge { font-size: 11px; background: var(--success-bg); color: #1a8a45; padding: 3px 9px; border-radius: var(--radius-pill); font-weight: 700; white-space: nowrap; }

        .empty-list { color: var(--text-muted); font-size: 14px; text-align: center; padding: 32px 0; }

        .action-bar { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface-2); }
        .selected-label { font-size: 13px; color: var(--text-secondary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .selected-label span { color: var(--text-primary); font-weight: 700; }
        .btn { background: linear-gradient(135deg, var(--primary), var(--primary-blue)); color: #fff; border: none; border-radius: 11px; padding: 11px 28px; font-size: 14px; cursor: pointer; font-weight: 700; white-space: nowrap; box-shadow: 0 6px 16px -8px rgba(79,70,229,0.6); transition: transform .1s, box-shadow .15s, filter .15s; }
        .btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .btn:disabled { background: #ccd2da; box-shadow: none; cursor: not-allowed; filter: none; transform: none; }

        /* ── 최근 분석 결과 ── */
        .results-section { min-width: 0; }
        .results-section h2 { font-size: 18px; margin-bottom: 16px; }
        .result-card { background: var(--surface); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .result-info { flex: 1; min-width: 0; }
        .result-filename { font-size: 14px; font-weight: 700; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .result-meta { font-size: 12px; color: var(--text-muted); }
        .phase-pills { display: flex; gap: 6px; flex-shrink: 0; }
        .pill { font-size: 12px; padding: 3px 10px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--text-secondary); }
        .pill.good { background: var(--success-bg); color: #1a8a45; }
        .pill.warn { background: var(--warning-bg); color: #b5770a; }
        .pill.bad  { background: var(--danger-bg); color: #c62828; }
        .view-btn { font-size: 13px; color: var(--primary); text-decoration: none; padding: 6px 14px; border: 1px solid var(--primary); border-radius: var(--radius-sm); white-space: nowrap; flex-shrink: 0; }
        .view-btn:hover { background: var(--primary); color: #fff; }

        /* ── 파일 목록 인라인 진행바 ── */
        .file-name-wrap { flex: 1; min-width: 0; }
        .inline-progress { display: none; margin-top: 5px; align-items: center; gap: 6px; }
        .inline-progress.active { display: flex; }
        .inline-bar-wrap { flex: 1; height: 5px; background: #e0e6ee; border-radius: 2px; overflow: hidden; }
        .inline-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--primary-blue)); border-radius: 2px; transition: width 0.5s; }
        .inline-pct { font-size: 11px; color: var(--primary); font-weight: 700; white-space: nowrap; }
        .analyzing-badge { display: none; font-size: 11px; background: var(--primary-light); color: var(--primary-dark); padding: 3px 9px; border-radius: var(--radius-pill); font-weight: 700; white-space: nowrap; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    </style>
</head>
<body>

    <aside th:replace="~{fragments/shell :: side('game')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/shell :: topbar}"></header>
<div class="page">
<h1>1판 복기 분석</h1>
<p class="subtitle">기보 한 판을 수별로 분석해 핵심 실수와 최선수를 알려드립니다.</p>

<div th:if="${error}" class="error-box" th:text="${error}"></div>

<div class="select-box">
    <!-- 탭 -->
    <div class="tabs">
        <div class="tab active" id="tabPro" onclick="switchTab('pro')">
            프로기보
            <span class="tab-count" th:text="${#lists.size(proFiles)}"></span>
        </div>
        <div class="tab" id="tabMy" onclick="switchTab('my')">
            나의기보
            <span class="tab-count" th:text="${#lists.size(files)}"></span>
        </div>
    </div>

    <!-- 프로기보 목록 -->
    <div class="file-list" id="listPro">
        <div th:if="${#lists.isEmpty(proFiles)}" class="empty-list">프로기보 없음</div>
        <div th:each="f : ${proFiles}"
             th:data-file="${f}"
             th:data-result-id="${resultMap != null and resultMap.containsKey(f) ? resultMap.get(f) : ''}"
             th:class="${resultMap != null and resultMap.containsKey(f) ? 'file-item analyzed' : 'file-item'}"
             onclick="selectFile(this)">
            <span class="file-icon">♟</span>
            <div class="file-name-wrap">
                <span class="file-name" th:text="${f}"></span>
                <div class="inline-progress">
                    <div class="inline-bar-wrap"><div class="inline-bar-fill"></div></div>
                    <span class="inline-pct">0%</span>
                </div>
            </div>
            <span th:if="${resultMap != null and resultMap.containsKey(f)}" class="analyzed-badge">분석 완료 · 결과 보기 →</span>
            <span class="analyzing-badge">분석 중</span>
        </div>
    </div>

    <!-- 나의기보 목록 -->
    <div class="file-list" id="listMy" style="display:none;">
        <div th:if="${#lists.isEmpty(files)}" class="empty-list">나의기보 없음</div>
        <div th:each="f : ${files}"
             th:data-file="${f}"
             th:data-result-id="${resultMap != null and resultMap.containsKey(f) ? resultMap.get(f) : ''}"
             th:class="${resultMap != null and resultMap.containsKey(f) ? 'file-item analyzed' : 'file-item'}"
             onclick="selectFile(this)">
            <span class="file-icon">🎯</span>
            <div class="file-name-wrap">
                <span class="file-name" th:text="${f}"></span>
                <div class="inline-progress">
                    <div class="inline-bar-wrap"><div class="inline-bar-fill"></div></div>
                    <span class="inline-pct">0%</span>
                </div>
            </div>
            <span th:if="${resultMap != null and resultMap.containsKey(f)}" class="analyzed-badge">분석 완료 · 결과 보기 →</span>
            <span class="analyzing-badge">분석 중</span>
        </div>
    </div>

    <!-- 하단 액션 바 -->
    <div class="action-bar">
        <div class="selected-label" id="selectedLabel">기보를 선택하세요</div>
        <form method="post" action="/game/analyze" onsubmit="document.getElementById('submitBtn').disabled = true" id="analyzeForm">
            <input type="hidden" name="fileName" id="selectedFile">
            <button class="btn" type="submit" id="submitBtn" disabled>분석 시작</button>
        </form>
    </div>
</div>

<!-- 전체 재분석(일괄) -->
<div class="results-section" style="margin-bottom:24px;">
    <div class="result-card" style="display:block;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
            <div>
                <div style="font-size:15px;font-weight:700;">🔁 저장된 기보 전체 재분석</div>
                <div style="font-size:12px;color:#888;margin-top:3px;">현재 정밀도(visits=1000)로 저장된 모든 기보를 다시 분석해 구 등급·형세 오판을 최신 기준으로 갱신합니다. TRT 가속으로 판당 수십 초.</div>
            </div>
            <form method="post" th:action="@{/game/reanalyze-all}" onsubmit="return confirm('저장된 모든 기보를 재분석합니다. 시간이 걸릴 수 있어요. 시작할까요?');">
                <button type="submit" class="btn" id="bulkBtn">전체 재분석 시작</button>
            </form>
        </div>
        <div id="bulkProgress" style="display:none;margin-top:14px;">
            <div style="height:10px;background:#eee;border-radius:99px;overflow:hidden;">
                <div id="bulkBar" style="height:100%;width:0;background:#4a90d9;transition:width .3s;"></div>
            </div>
            <div id="bulkText" style="font-size:12px;color:#666;margin-top:6px;"></div>
        </div>
    </div>
</div>
<script>
(function () {
    const prog = document.getElementById('bulkProgress'), bar = document.getElementById('bulkBar'),
          txt = document.getElementById('bulkText'), btn = document.getElementById('bulkBtn');
    let wasRunning = false;
    function poll() {
        fetch('/game/reanalyze-all/status').then(r => r.json()).then(s => {
            if (s.running) {
                wasRunning = true; prog.style.display = '';
                if (btn) { btn.disabled = true; btn.textContent = '재분석 중…'; }
                const pct = s.total ? Math.round(s.done * 100 / s.total) : 0;
                bar.style.width = pct + '%';
                txt.textContent = `${s.done}/${s.total} 완료${s.current ? ' · 현재: ' + s.current : ''}`;
                setTimeout(poll, 1500);
            } else if (wasRunning) {                         // 방금 끝남 → 결과 목록 갱신
                bar.style.width = '100%'; txt.textContent = s.message || '완료';
                setTimeout(() => location.reload(), 1200);
            } else if (s.message) {                          // 직전 완료 요약 표시
                prog.style.display = ''; bar.style.width = '100%'; txt.textContent = s.message;
            }
        }).catch(() => {});
    }
    poll();
})();
</script>

<script>
function switchTab(tab) {
    document.getElementById('tabPro').classList.toggle('active', tab === 'pro');
    document.getElementById('tabMy').classList.toggle('active', tab === 'my');
    document.getElementById('listPro').style.display = tab === 'pro' ? '' : 'none';
    document.getElementById('listMy').style.display  = tab === 'my'  ? '' : 'none';
}

function selectFile(el) {
    // 이미 분석된 기보는 선택 대신 결과 화면으로 바로 이동
    const resultId = el.dataset.resultId;
    if (resultId) { location.href = '/game/result/' + resultId; return; }
    const fileName = el.dataset.file;
    document.querySelectorAll('.file-item.selected').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('selectedFile').value = fileName;
    document.getElementById('selectedLabel').innerHTML = '선택: <span>' + fileName + '</span>';
    document.getElementById('submitBtn').disabled = false;
}

// 실행 중인 분석 진행률 폴링
let prevRunningFiles = new Set();

function pollRunningJobs() {
    fetch('/game/running-jobs')
        .then(r => r.json())
        .then(jobs => {
            const currentFiles = new Set(jobs.map(j => j.fileName));

            // 이전에 분석 중이었지만 지금은 아닌 항목 → 페이지 새로고침(완료 배지 반영)
            if (prevRunningFiles.size > 0) {
                for (const fn of prevRunningFiles) {
                    if (!currentFiles.has(fn)) {
                        location.reload();
                        return;
                    }
                }
            }
            prevRunningFiles = currentFiles;

            // 모든 file-item 초기화
            document.querySelectorAll('.file-item').forEach(el => {
                el.querySelector('.inline-progress').classList.remove('active');
                el.querySelector('.analyzing-badge').style.display = 'none';
            });

            // 진행 중인 항목 업데이트
            jobs.forEach(job => {
                const el = Array.from(document.querySelectorAll('.file-item'))
                    .find(e => e.dataset.file === job.fileName);
                if (!el) return;
                const prog = el.querySelector('.inline-progress');
                prog.classList.add('active');
                prog.querySelector('.inline-bar-fill').style.width = job.progress + '%';
                prog.querySelector('.inline-pct').textContent = job.progress + '%';
                el.querySelector('.analyzing-badge').style.display = '';
            });

            setTimeout(pollRunningJobs, 2000);
        })
        .catch(() => setTimeout(pollRunningJobs, 5000));
}

pollRunningJobs();
</script>
</div>
    </main>
</body>
</html>
