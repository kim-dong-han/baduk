<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 대국</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        html { height: 100%; }
        /* 셸(body grid) + .main.fill 이 높이를 잡으므로 body 는 배경만 담당 */
        body { margin: 0; padding: 0; height: 100%; background: var(--background); }

        /* ── 레이아웃 ── */
        .play-layout {
            flex: 1;
            min-height: 0;
            display: flex;
            background: var(--sidebar-1);
        }
        .board-area {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        #boardCanvas {
            display: block;
            border-radius: 6px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.6);
            cursor: crosshair;
        }
        #boardCanvas.waiting { cursor: not-allowed; }

        /* ── 우측 패널 ── */
        .play-panel {
            width: 240px;
            min-width: 240px;
            background: #fff;
            overflow-y: auto;
            padding: 20px 16px;
            box-shadow: -2px 0 16px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-title { font-size: 18px; font-weight: 800; color: var(--text-primary); margin: 0 0 4px; }
        .panel-sub   { font-size: 12px; color: var(--text-muted); margin: 0; }

        .info-card {
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border: 1px solid var(--border);
        }
        .info-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .info-value { font-size: 15px; font-weight: 700; color: var(--text-primary); }

        .stone-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
        .stone-circle { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
        .stone-circle.black { background: radial-gradient(circle at 35% 32%, #666, #111); }
        .stone-circle.white { background: radial-gradient(circle at 35% 32%, #fff, #ccc); border: 1px solid #bbb; }
        .stone-label { font-size: 13px; color: #555; flex: 1; }
        .stone-cap   { font-size: 14px; font-weight: 700; color: #333; }

        /* 턴 표시 */
        .turn-card { border-left: 4px solid var(--primary); }
        .turn-card.your-turn  { border-left-color: var(--success); }
        .turn-card.ai-turn    { border-left-color: var(--danger); }
        .turn-card.game-over  { border-left-color: var(--text-muted); }

        /* AI 생각 중 스피너 */
        .thinking-row { display: flex; align-items: center; gap: 10px; }
        .think-spin { width: 18px; height: 18px; border: 3px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
        /* @keyframes spin 은 common.css 공통 규칙 사용 */

        /* 버튼 */
        .panel-btn {
            width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
            cursor: pointer; border: none; transition: filter 0.15s, background 0.15s, opacity 0.15s;
        }
        .panel-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary  { background: linear-gradient(135deg, var(--primary), var(--primary-blue)); color: #fff; }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
        .btn-black    { background: var(--sidebar-1); color: #fff; }
        .btn-black:hover:not(:disabled)  { background: #26324d; }
        .btn-white    { background: #f0f0f0; color: #333; border: 1px solid #ccc; }
        .btn-white:hover:not(:disabled)  { background: #e0e0e0; }
        .btn-secondary { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border-strong); }
        .btn-secondary:hover:not(:disabled) { background: #e7ebf1; }
        .btn-danger   { background: var(--danger-bg); color: #c0392b; }
        .btn-danger:hover:not(:disabled)  { background: #f1948a; color: #fff; }
        .btn-hint     { background: #f1c40f; color: #5b4a06; }
        .btn-hint:hover:not(:disabled)    { background: #e6b800; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

        /* AI 착수 표시 */
        .ai-move-badge { display: inline-block; background: linear-gradient(135deg, var(--primary), var(--primary-blue)); color: #fff; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }

        /* 게임 종료 */
        .gameover-msg { background: var(--warning-bg); border: 1px solid #fad7a0; border-radius: var(--radius-sm); padding: 14px; text-align: center; }
        .gameover-title { font-size: 16px; font-weight: 800; color: #e67e22; margin-bottom: 6px; }
        .gameover-sub   { font-size: 12px; color: var(--text-muted); }

        /* 색 선택 */
        .color-pick { display: flex; gap: 8px; }
        .color-pick .panel-btn { flex: 1; padding: 14px 8px; font-size: 15px; }
    </style>
</head>
<body>

    <aside th:replace="~{fragments/shell :: side('play')}"></aside>
    <main class="main fill">
        <header th:replace="~{fragments/shell :: topbar}"></header>
<div class="play-layout">

    <!-- ══ 바둑판 영역 ══ -->
    <div class="board-area">
        <canvas id="boardCanvas"></canvas>
    </div>

    <!-- ══ 우측 패널 ══ -->
    <div class="play-panel">
        <div>
            <p class="panel-title">AI 대국</p>
            <p class="panel-sub">KataGo AI와 실시간 대국</p>
        </div>

        <!-- 게임 시작 전 -->
        <div id="setupSection">
            <div class="info-card" style="text-align:center;padding:20px 14px;">
                <div style="font-size:13px;color:#666;margin-bottom:16px;">돌 색을 선택하세요</div>
                <div class="color-pick">
                    <button class="panel-btn btn-black" onclick="startGame('B')">⚫<br><span style="font-size:11px;font-weight:400;">흑 (선)</span></button>
                    <button class="panel-btn btn-white" onclick="startGame('W')">⚪<br><span style="font-size:11px;font-weight:400;">백 (후)</span></button>
                </div>
            </div>
        </div>

        <!-- 게임 중 -->
        <div id="gameSection" style="display:none;">

            <!-- 턴 표시 -->
            <div class="info-card turn-card" id="turnCard">
                <div class="info-label">현재 차례</div>
                <div id="turnText" class="info-value">-</div>
            </div>

            <!-- 승률 바: 누가 유리한지 한눈에 -->
            <div class="info-card" id="wrBar" style="display:none;padding:12px 14px;">
                <div class="info-label" style="margin-bottom:8px;">AI 승률 · 형세</div>
                <div style="position:relative;height:24px;border-radius:6px;overflow:hidden;display:flex;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);">
                    <div id="wrBarBlack" style="height:100%;width:50%;background:linear-gradient(90deg,#2b2b2b,#4a4a4a);transition:width .4s ease;"></div>
                    <div style="flex:1;height:100%;background:linear-gradient(90deg,#dcdcdc,#f2f2f2);"></div>
                    <span id="wrBarBlackLbl" style="position:absolute;left:8px;top:0;line-height:24px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);">흑 50%</span>
                    <span id="wrBarWhiteLbl" style="position:absolute;right:8px;top:0;line-height:24px;font-size:12px;font-weight:700;color:#555;">백 50%</span>
                </div>
                <div id="wrBarScore" style="text-align:center;font-size:12px;color:#888;margin-top:6px;"></div>
            </div>

            <!-- AI 생각 중 -->
            <div class="info-card" id="thinkingCard" style="display:none;">
                <div class="thinking-row">
                    <div class="think-spin"></div>
                    <span style="font-size:13px;color:#555;font-weight:600;">AI 생각 중...</span>
                </div>
            </div>

            <!-- 방금 둔 내 수 평가 (실시간) -->
            <div class="info-card" id="moveEvalCard" style="display:none;border-left:4px solid var(--primary);">
                <div class="info-label">방금 둔 내 수</div>
                <div class="info-value" id="moveEvalText" style="margin-top:4px;">-</div>
            </div>

            <!-- 형세 판단 / 계가 결과 -->
            <div class="info-card" id="estimateCard" style="display:none;border-left:4px solid #16a085;">
                <div class="info-label" id="estimateLabel">형세 판단</div>
                <div class="info-value" id="estimateText" style="margin-top:4px;">-</div>
            </div>

            <!-- 추천수 힌트 요약: 각 수를 두면 이길 확률 + 유리/불리 -->
            <div class="info-card" id="hintCard" style="display:none;border-left:4px solid #f1c40f;">
                <div class="info-label">추천수 · 두면 이길 확률</div>
                <div id="hintVerdict" style="margin:4px 0 6px;font-weight:800;font-size:14px;">-</div>
                <div id="hintList" style="font-size:12px;color:#555;line-height:1.7;"></div>
                <div style="margin-top:6px;font-size:11px;color:#aaa;">바둑판의 숫자 = 그 자리에 두면 나의 예상 승률(%)</div>
            </div>

            <!-- AI 마지막 착수 -->
            <div class="info-card" id="aiLastCard" style="display:none;">
                <div class="info-label">AI 착수</div>
                <div style="margin-top:4px;"><span class="ai-move-badge" id="aiLastMove">-</span></div>
            </div>

            <!-- 수 번호 -->
            <div class="info-card">
                <div class="info-label">진행</div>
                <div class="info-value" id="moveCount">0수</div>
            </div>

            <!-- 집힌 돌 -->
            <div class="info-card">
                <div class="info-label">집힌 돌</div>
                <div class="stone-row">
                    <div class="stone-circle black"></div>
                    <span class="stone-label">흑이 잡은 수</span>
                    <span class="stone-cap" id="blackCaptures">0</span>
                </div>
                <div class="stone-row">
                    <div class="stone-circle white"></div>
                    <span class="stone-label">백이 잡은 수</span>
                    <span class="stone-cap" id="whiteCaptures">0</span>
                </div>
            </div>

            <hr class="divider">

            <!-- 액션 버튼 -->
            <div class="btn-group">
                <button class="panel-btn btn-hint" id="btnHint" onclick="requestHint()" title="지금 둘 곳 중 AI 추천수 상위 5개를 바둑판에 승률%와 함께 표시합니다(1순위=금색)">💡 추천수 힌트</button>
                <button class="panel-btn btn-secondary" id="btnEstimate" onclick="requestEstimate(false)" title="현재 국면의 형세(집 차·승률)와 집 영역을 판정">📊 형세 판단</button>
                <button class="panel-btn btn-secondary" id="btnScore" onclick="requestEstimate(true)" title="지금까지의 국면으로 예상 계가 (누가 몇 집 이겼는지)">🏁 계가하기</button>
                <button class="panel-btn btn-secondary" id="btnPass"   onclick="passMove()">패스</button>
                <button class="panel-btn btn-secondary" id="btnUndo"   onclick="undoMove()">무르기 (2수)</button>
                <button class="panel-btn btn-danger"    id="btnResign" onclick="resignGame()">불계패</button>
            </div>

            <hr class="divider">
            <button class="panel-btn btn-secondary" onclick="resetToSetup()">새 대국</button>
        </div>

        <!-- 게임 종료 -->
        <div id="gameOverSection" style="display:none;">
            <div class="gameover-msg">
                <div class="gameover-title" id="gameOverTitle">게임 종료</div>
                <div class="gameover-sub"  id="gameOverSub"></div>
            </div>
            <div style="margin-top:12px;">
                <button class="panel-btn btn-primary" onclick="resetToSetup()">새 대국</button>
            </div>
        </div>

    </div>
</div>

<script th:inline="none">
/* ══════════════════════════════════
   바둑판 상수 (동적 계산)
══════════════════════════════════ */
let CELL, PAD, BOARD_PX;
const canvas = document.getElementById('boardCanvas');
const ctx    = canvas.getContext('2d');

function computeLayout() {
    const area   = document.querySelector('.board-area');
    const gap    = 24;
    const availW = area.clientWidth  - gap;
    const availH = area.clientHeight - gap;
    const bs     = Math.max(200, Math.min(availW, availH));
    CELL         = Math.floor(bs / 20.5);
    PAD          = Math.round(CELL * 1.3);
    BOARD_PX     = PAD * 2 + CELL * 18;
    canvas.width        = BOARD_PX;
    canvas.height       = BOARD_PX;
    canvas.style.width  = BOARD_PX + 'px';
    canvas.style.height = BOARD_PX + 'px';
}
window.addEventListener('resize', () => { computeLayout(); redraw(); });

function px(gx) { return PAD + gx * CELL; }
function py(gy) { return PAD + (18 - gy) * CELL; }

/* ══════════════════════════════════
   게임 상태
══════════════════════════════════ */
let history       = [];  // [{color, gtp}]
let userColor     = 'B';
let gameStarted   = false;
let waitingForAI  = false;
let isOver        = false;
let blackCaptures = 0;
let whiteCaptures = 0;
let hoverCell     = null;
let lastAiMove    = null;
let hintCells     = [];    // 추천수 힌트 상위 5개 [{x,y,rank,winrate}] — 판 위에 승률%로 표시
let hintRaf       = null;  // 힌트 펄스 애니메이션 프레임
let estOwnership  = null;  // 형세 판단/계가 시 집 영역(361칸) 오버레이

// 다음 착수 색 = 마지막 수의 반대 (빈 판이면 흑). 백선착·이어두기 국면 대응
function sideToMove() {
    if (history.length === 0) return 'B';
    return history[history.length - 1].color === 'B' ? 'W' : 'B';
}

/* ══════════════════════════════════
   좌표 변환
══════════════════════════════════ */
const COLS = 'ABCDEFGHJKLMNOPQRST';
function gridToGtp(gx, gy) { return COLS[gx] + String(gy + 1); }
function gtpToGrid(gtp) {
    if (!gtp || gtp.toLowerCase() === 'pass') return null;
    const c = gtp[0].toUpperCase();
    let x = c.charCodeAt(0) - 65;
    if (x >= 8) x--;
    const y = parseInt(gtp.substring(1)) - 1;
    if (isNaN(y) || x < 0 || x > 18 || y < 0 || y > 18) return null;
    return {x, y};
}
function getGridFromEvent(e) {
    const rect   = canvas.getBoundingClientRect();   // 반응형: 가로·세로 배율 각각 적용
    const mx     = (e.clientX - rect.left) * (BOARD_PX / rect.width);
    const my     = (e.clientY - rect.top)  * (BOARD_PX / rect.height);
    const gx     = Math.round((mx - PAD) / CELL);
    const gy     = 18 - Math.round((my - PAD) / CELL);
    if (gx < 0 || gx > 18 || gy < 0 || gy > 18) return null;
    return {x: gx, y: gy};
}

/* ══════════════════════════════════
   보드 상태 시뮬레이션
══════════════════════════════════ */
function emptyBoard() {
    return Array.from({length: 19}, () => Array(19).fill(null));
}
function adjacent(x, y) {
    const r = [];
    if (x > 0)  r.push([x-1, y]);
    if (x < 18) r.push([x+1, y]);
    if (y > 0)  r.push([x, y-1]);
    if (y < 18) r.push([x, y+1]);
    return r;
}
function getGroup(board, x, y) {
    const color = board[x][y], group = [], visited = new Set(), stack = [[x, y]];
    while (stack.length) {
        const [cx, cy] = stack.pop();
        const key = cx * 19 + cy;
        if (visited.has(key)) continue;
        visited.add(key);
        if (board[cx][cy] !== color) continue;
        group.push([cx, cy]);
        for (const [nx, ny] of adjacent(cx, cy))
            if (!visited.has(nx * 19 + ny)) stack.push([nx, ny]);
    }
    return group;
}
function hasLiberty(board, group) {
    for (const [x, y] of group)
        for (const [nx, ny] of adjacent(x, y))
            if (board[nx][ny] === null) return true;
    return false;
}
function applyMove(board, color, gtp) {
    const g = gtpToGrid(gtp);
    if (!g) return 0; // pass
    if (board[g.x][g.y]) return -1; // occupied
    board[g.x][g.y] = color;
    const opp = color === 'B' ? 'W' : 'B';
    let captured = 0;
    for (const [nx, ny] of adjacent(g.x, g.y)) {
        if (board[nx][ny] === opp) {
            const grp = getGroup(board, nx, ny);
            if (!hasLiberty(board, grp)) {
                captured += grp.length;
                for (const [gx, gy] of grp) board[gx][gy] = null;
            }
        }
    }
    // 자충수 제거
    const selfGrp = getGroup(board, g.x, g.y);
    if (!hasLiberty(board, selfGrp)) for (const [gx, gy] of selfGrp) board[gx][gy] = null;
    return captured;
}
function buildBoard() {
    const board = emptyBoard();
    let bc = 0, wc = 0;
    for (const {color, gtp} of history) {
        const caps = applyMove(board, color, gtp);
        if (caps > 0) {
            if (color === 'B') bc += caps; else wc += caps;
        }
    }
    blackCaptures = bc; whiteCaptures = wc;
    return board;
}
function isLegal(board, color, gx, gy) {
    if (board[gx][gy]) return false;
    const tmp = board.map(c => c.slice());
    tmp[gx][gy] = color;
    const opp = color === 'B' ? 'W' : 'B';
    for (const [nx, ny] of adjacent(gx, gy)) {
        if (tmp[nx][ny] === opp) {
            const grp = getGroup(tmp, nx, ny);
            if (!hasLiberty(tmp, grp)) return true; // capture → legal
        }
    }
    return hasLiberty(tmp, getGroup(tmp, gx, gy));
}

/* ══════════════════════════════════
   그리기
══════════════════════════════════ */
function drawBoard() {
    const bg = ctx.createLinearGradient(0, 0, BOARD_PX, BOARD_PX);
    bg.addColorStop(0, '#E8B86D'); bg.addColorStop(1, '#C9954A');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, BOARD_PX, BOARD_PX);

    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 0.8;
    for (let i = 0; i < 19; i++) {
        ctx.beginPath(); ctx.moveTo(px(i), py(0));  ctx.lineTo(px(i), py(18)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px(0), py(i));  ctx.lineTo(px(18), py(i)); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    [3,9,15].forEach(a => [3,9,15].forEach(b => {
        ctx.beginPath(); ctx.arc(px(a), py(b), CELL * 0.12, 0, Math.PI * 2); ctx.fill();
    }));
    const COLNAMES = 'ABCDEFGHJKLMNOPQRST';
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.font = `${Math.round(CELL*0.32)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 19; i++) {
        ctx.fillText(COLNAMES[i], px(i), PAD - CELL * 0.52);
        ctx.fillText(COLNAMES[i], px(i), BOARD_PX - PAD + CELL * 0.52);
        ctx.fillText(String(i+1), PAD - CELL * 0.55, py(i));
        ctx.fillText(String(i+1), BOARD_PX - PAD + CELL * 0.55, py(i));
    }
}
function drawStone(gx, gy, color, isLast) {
    const cx = px(gx), cy = py(gy), r = CELL * 0.46;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    if (color === 'B') {
        const g = ctx.createRadialGradient(cx - r*.32, cy - r*.32, r*.08, cx, cy, r);
        g.addColorStop(0, '#555'); g.addColorStop(1, '#000');
        ctx.fillStyle = g;
    } else {
        const g = ctx.createRadialGradient(cx - r*.32, cy - r*.32, r*.08, cx, cy, r);
        g.addColorStop(0, '#fff'); g.addColorStop(1, '#ccc');
        ctx.fillStyle = g;
        ctx.fill(); ctx.strokeStyle = '#888'; ctx.lineWidth = 0.8; ctx.stroke();
    }
    ctx.fill();
    if (isLast) {
        ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, Math.PI * 2);
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = Math.max(1.5, CELL * 0.07); ctx.stroke();
    }
}
function drawHover(gx, gy, color) {
    const cx = px(gx), cy = py(gy), r = CELL * 0.46;
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color === 'B' ? '#111' : '#f5f5f5';
    ctx.fill();
    if (color === 'W') { ctx.strokeStyle = '#999'; ctx.lineWidth = 0.8; ctx.stroke(); }
    ctx.restore();
}
/* 승률(0~100, 내 관점) → 색: 빨강(나쁨)→노랑→초록(좋음) */
function hintWrColor(w) {
    const hue = Math.max(0, Math.min(120, (w / 100) * 120));   // 0=빨강 → 120=초록
    return `hsl(${hue.toFixed(0)}, 65%, 44%)`;
}
/* 추천수 힌트: 상위 5개 자리에 승률% 원반. 1순위(최선수)는 금색 펄스 링으로 강조. */
function drawHintMarkers(t) {
    if (!hintCells.length) return;
    const phase = (t % 1200) / 1200;
    const wave  = 0.5 + 0.5 * Math.sin(phase * Math.PI * 2);
    ctx.save();
    hintCells.forEach(h => {
        const cx = px(h.x), cy = py(h.y), r = CELL * 0.46;
        // 승률 색 원반
        ctx.globalAlpha = 0.82;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = hintWrColor(h.winrate);
        ctx.fill();
        ctx.globalAlpha = 1;
        // 1순위=금색 펄스 링, 그 외=흰 테두리
        if (h.rank === 1) {
            ctx.beginPath(); ctx.arc(cx, cy, r + CELL * 0.06 * wave, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(241,196,15,${(0.55 + 0.4 * wave).toFixed(2)})`;
            ctx.lineWidth = Math.max(2, CELL * 0.09);
            ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5; ctx.stroke();
        // 승률 % 텍스트 — 소수점 첫째자리(값 크기로 순위 구분)
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.round(CELL * 0.27)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(Math.min(99.9, Math.max(0.1, h.winrate)).toFixed(1) + '%', cx, cy);
    });
    ctx.restore();
}
/* 집 영역(ownership) 오버레이: +값=흑·−값=백, 확신할수록 큰 사각형 (돌보다 먼저 그림) */
function drawOwnershipPlay(own) {
    if (!own || own.length !== 361) return;
    for (let gx = 0; gx < 19; gx++) {
        for (let gy = 0; gy < 19; gy++) {
            const v = own[(18 - gy) * 19 + gx];
            if (v == null) continue;
            const a = Math.abs(v);
            if (a < 0.15) continue;
            const side = CELL * 0.82 * a;
            ctx.fillStyle = v > 0 ? `rgba(0,0,0,${(0.55 * a).toFixed(3)})`
                                  : `rgba(255,255,255,${(0.85 * a).toFixed(3)})`;
            ctx.fillRect(px(gx) - side / 2, py(gy) - side / 2, side, side);
        }
    }
}
function redraw() {
    drawBoard();
    const board = buildBoard();
    if (estOwnership) drawOwnershipPlay(estOwnership);   // 돌 아래에 집 영역
    const lastGtp = history.length > 0 ? history[history.length - 1].gtp : null;
    const lastG   = lastGtp ? gtpToGrid(lastGtp) : null;
    for (let x = 0; x < 19; x++)
        for (let y = 0; y < 19; y++)
            if (board[x][y]) drawStone(x, y, board[x][y], lastG && x === lastG.x && y === lastG.y);

    // 호버 미리보기
    if (hoverCell && !board[hoverCell.x][hoverCell.y] && !waitingForAI && !isOver && gameStarted) {
        const nextColor = sideToMove();
        if (nextColor === userColor && isLegal(board, nextColor, hoverCell.x, hoverCell.y)) {
            drawHover(hoverCell.x, hoverCell.y, nextColor);
        }
    }

    // 추천수 힌트 마커 (활성 시)
    if (hintCells.length) drawHintMarkers(performance.now());

    // UI 갱신
    document.getElementById('blackCaptures').textContent = blackCaptures;
    document.getElementById('whiteCaptures').textContent = whiteCaptures;
    document.getElementById('moveCount').textContent     = history.length + '수';
}

/* ══════════════════════════════════
   클릭 / 호버 이벤트
══════════════════════════════════ */
canvas.addEventListener('click', function(e) {
    if (!gameStarted || waitingForAI || isOver) return;
    const g = getGridFromEvent(e);
    if (!g) return;
    const board = buildBoard();
    if (!isLegal(board, userColor, g.x, g.y)) return;
    sendMove(gridToGtp(g.x, g.y));
});

canvas.addEventListener('mousemove', function(e) {
    if (!gameStarted || waitingForAI || isOver) return;
    const g = getGridFromEvent(e);
    if (!g) {
        if (hoverCell) { hoverCell = null; redraw(); }
        return;
    }
    if (hoverCell && hoverCell.x === g.x && hoverCell.y === g.y) return;
    hoverCell = g; redraw();
});
canvas.addEventListener('mouseleave', function() {
    if (hoverCell) { hoverCell = null; redraw(); }
});

/* ══════════════════════════════════
   패널 UI 갱신
══════════════════════════════════ */
function updateTurnUI() {
    const tc   = document.getElementById('turnCard');
    const txt  = document.getElementById('turnText');
    if (isOver) {
        tc.className = 'info-card turn-card game-over';
        txt.textContent = '게임 종료';
        return;
    }
    const nextColor = sideToMove();
    const isUser    = nextColor === userColor;
    tc.className = 'info-card turn-card ' + (isUser ? 'your-turn' : 'ai-turn');
    const colorLabel = nextColor === 'B' ? '⚫ 흑' : '⚪ 백';
    txt.textContent  = colorLabel + (isUser ? ' (내 차례)' : ' (AI)');
    const bh = document.getElementById('btnHint');
    if (bh && !waitingForAI) bh.disabled = !isUser;   // 내 차례에만 힌트 가능
}
function setWaiting(on) {
    waitingForAI = on;
    canvas.className = on ? 'waiting' : '';
    document.getElementById('thinkingCard').style.display = on ? '' : 'none';
    ['btnPass','btnUndo','btnResign','btnHint','btnEstimate','btnScore'].forEach(id => {
        document.getElementById(id).disabled = on;
    });
}
function showAiMove(gtp) {
    lastAiMove = gtp;
    const card = document.getElementById('aiLastCard');
    const lbl  = document.getElementById('aiLastMove');
    card.style.display = '';
    lbl.textContent    = gtp === 'pass' ? '패스' : gtp;
}
/* 실시간 수 평가: 방금 둔 내 수의 '최선 대비 집손해'를 등급·색으로 표시 */
function showMoveEval(loss) {
    const card = document.getElementById('moveEvalCard');
    const txt  = document.getElementById('moveEvalText');
    if (loss === null || loss === undefined) { card.style.display = 'none'; return; }
    let grade, color;
    if      (loss < 0.5) { grade = '최선'; color = '#2ecc71'; }
    else if (loss < 1.5) { grade = '좋음'; color = '#27ae60'; }
    else if (loss < 3.0) { grade = '보통'; color = '#f1c40f'; }
    else if (loss < 5.0) { grade = '실수'; color = '#e67e22'; }
    else                 { grade = '악수'; color = '#e74c3c'; }
    const lossTxt = loss < 0.05 ? '최선과 동일' : `최선 대비 -${loss.toFixed(1)}집`;
    card.style.borderLeftColor = color;
    txt.innerHTML = `<span style="color:${color};font-weight:800;">${grade}</span> <span style="font-size:12px;color:#666;">· ${lossTxt}</span>`;
    card.style.display = '';
}
function showGameOver(title, sub) {
    isOver = true;
    document.getElementById('gameSection').style.display    = 'none';
    document.getElementById('gameOverSection').style.display = '';
    document.getElementById('gameOverTitle').textContent = title;
    document.getElementById('gameOverSub').textContent   = sub || '';
    updateTurnUI();
    redraw();
}

/* ══════════════════════════════════
   API 호출
══════════════════════════════════ */
function startGame(color) {
    userColor = color;
    fetch('/api/play/new', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({userColor: color})
    })
    .then(r => r.json())
    .then(data => {
        if (!data.ok) { alert('오류: ' + data.error); return; }
        history = []; blackCaptures = 0; whiteCaptures = 0;
        isOver = false; lastAiMove = null;
        gameStarted = true;

        document.getElementById('setupSection').style.display    = 'none';
        document.getElementById('gameOverSection').style.display = 'none';
        document.getElementById('gameSection').style.display     = '';
        document.getElementById('aiLastCard').style.display      = 'none';
        document.getElementById('moveEvalCard').style.display    = 'none';

        if (data.aiMove) {
            history.push({color: color === 'B' ? 'W' : 'B', gtp: data.aiMove});
            showAiMove(data.aiMove);
        }
        setWaiting(false);
        updateTurnUI();
        redraw();
        refreshWinrateBar();   // 대국 시작 시 초기 형세 승률 바
    })
    .catch(err => { setWaiting(false); alert('연결 오류: ' + err); });

    // AI가 선착(백 선택)할 때 스피너 표시
    if (color === 'W') {
        document.getElementById('setupSection').style.display    = 'none';
        document.getElementById('gameSection').style.display     = '';
        document.getElementById('gameOverSection').style.display = 'none';
        document.getElementById('aiLastCard').style.display      = 'none';
        document.getElementById('moveEvalCard').style.display    = 'none';
        gameStarted = true;
        setWaiting(true);
        updateTurnUI();
        redraw();
    }
}

function sendMove(gtp) {
    clearHint(); clearEstimate();
    setWaiting(true); hoverCell = null;
    history.push({color: userColor, gtp});
    updateTurnUI(); redraw();

    fetch('/api/play/move', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({gtp})
    })
    .then(r => r.json())
    .then(data => {
        setWaiting(false);
        if (!data.ok) { history.pop(); redraw(); alert('착수 불가: ' + data.error); return; }

        showMoveEval(data.userLoss);   // 방금 둔 내 수 실시간 평가

        if (data.aiMove) {
            const aiColor = userColor === 'B' ? 'W' : 'B';
            history.push({color: aiColor, gtp: data.aiMove});
            showAiMove(data.aiMove);
        }
        if (data.gameOver) {
            showGameOver('더블 패스', '쌍방 패스로 대국이 종료되었습니다.');
            requestFinalScore();   // 종료 시 자동 계가
        } else {
            updateTurnUI();
            refreshWinrateBar();   // 착수 후 승률 바 실시간 갱신
        }
        redraw();
    })
    .catch(err => { setWaiting(false); history.pop(); redraw(); alert('오류: ' + err); });
}

function passMove() {
    if (waitingForAI || isOver) return;
    clearHint(); clearEstimate();
    setWaiting(true); hoverCell = null;
    const color = sideToMove();
    history.push({color, gtp: 'pass'});
    updateTurnUI(); redraw();

    fetch('/api/play/pass', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: '{}'
    })
    .then(r => r.json())
    .then(data => {
        setWaiting(false);
        if (!data.ok) { history.pop(); redraw(); return; }
        if (data.aiMove !== undefined && data.aiMove !== null) {
            const aiColor = userColor === 'B' ? 'W' : 'B';
            history.push({color: aiColor, gtp: data.aiMove});
            showAiMove(data.aiMove);
        }
        if (data.gameOver) {
            showGameOver('더블 패스', '쌍방 패스로 대국이 종료되었습니다.');
            requestFinalScore();   // 종료 시 자동 계가
        } else {
            updateTurnUI();
            refreshWinrateBar();   // 착수 후 승률 바 실시간 갱신
        }
        redraw();
    })
    .catch(err => { setWaiting(false); history.pop(); redraw(); alert('오류: ' + err); });
}

function undoMove() {
    if (waitingForAI || isOver) return;
    fetch('/api/play/undo', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(r => r.json())
    .then(data => {
        if (!data.ok) return;
        history = data.history.map(h => ({color: h.color, gtp: h.gtp}));
        isOver = false;
        clearHint(); clearEstimate();
        document.getElementById('aiLastCard').style.display = 'none';
        document.getElementById('moveEvalCard').style.display = 'none';
        updateTurnUI(); redraw();
        refreshWinrateBar();   // 무르기 후 승률 바 갱신
    });
}

function resignGame() {
    if (waitingForAI || isOver) return;
    const side = userColor === 'B' ? '흑' : '백';
    showGameOver(side + ' 불계패', 'AI의 승리입니다.');
}

function resetToSetup() {
    clearHint(); clearEstimate();
    gameStarted = false; isOver = false; waitingForAI = false;
    history = []; blackCaptures = 0; whiteCaptures = 0; hoverCell = null; lastAiMove = null;
    document.querySelector('.panel-sub').textContent = 'KataGo AI와 실시간 대국';
    document.getElementById('setupSection').style.display    = '';
    document.getElementById('gameSection').style.display     = 'none';
    document.getElementById('gameOverSection').style.display = 'none';
    const wb = document.getElementById('wrBar'); if (wb) wb.style.display = 'none';
    redraw();
}

/* ══════════════════════════════════
   최선수 힌트 (판 위 위치로 표시)
══════════════════════════════════ */
function requestHint() {
    if (!gameStarted || waitingForAI || isOver) return;
    if (sideToMove() !== userColor) return;               // 내 차례에만
    const btn = document.getElementById('btnHint');
    btn.disabled = true;
    btn.textContent = '💡 분석 중...';
    fetch('/api/play/hint', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(r => r.json())
    .then(data => {
        btn.textContent = '💡 추천수 힌트';
        btn.disabled = false;
        const hints = (data.ok && Array.isArray(data.hints)) ? data.hints : [];
        if (!hints.length) return;
        // 최선수(1순위)가 패스면 알림
        if ((hints[0].move || '').toLowerCase() === 'pass') {
            clearHint();
            btn.textContent = '💡 최선수는 패스';
            setTimeout(() => { btn.textContent = '💡 추천수 힌트'; }, 2000);
            return;
        }
        hintCells = [];
        hints.forEach((h, i) => {
            if (!h.move || h.move.toLowerCase() === 'pass') return;   // 패스 후보는 판에 못 그림
            const g = gtpToGrid(h.move);
            if (!g) return;
            const wr = Math.min(99.9, Math.max(0.1, h.winrate));      // 100/0 표기 방지
            hintCells.push({ x: g.x, y: g.y, rank: i + 1, winrate: wr });
        });
        if (hintCells.length) startHintAnim();
        renderHintCard(hints);
    })
    .catch(() => { btn.textContent = '💡 추천수 힌트'; btn.disabled = false; });
}
/* 추천수 요약 카드: 각 수를 두면 이길 확률 + 지금 유리/불리 판정(최선수 승률 기준) */
function renderHintCard(hints) {
    const card = document.getElementById('hintCard');
    if (!hints.length) { card.style.display = 'none'; return; }
    const best = Math.min(99.9, Math.max(0.1, hints[0].winrate));
    let verdict, color;
    if (best >= 60)      { verdict = `유리 (최선수 승률 ${best.toFixed(0)}%)`; color = '#1e8449'; }
    else if (best <= 40) { verdict = `불리 (최선수 승률 ${best.toFixed(0)}%)`; color = '#c0392b'; }
    else                 { verdict = `팽팽 (최선수 승률 ${best.toFixed(0)}%)`; color = '#b7950b'; }
    document.getElementById('hintVerdict').textContent = verdict;
    document.getElementById('hintVerdict').style.color = color;
    const medal = ['🥇','🥈','🥉','④','⑤'];
    document.getElementById('hintList').innerHTML = hints.map((h, i) => {
        const wr = Math.min(99.9, Math.max(0.1, h.winrate));
        const mv = (h.move || '').toLowerCase() === 'pass' ? '패스' : (h.move || '').toUpperCase();
        return `<div>${medal[i] || (i+1)} <b>${mv}</b> → 두면 승률 <b>${wr.toFixed(0)}%</b></div>`;
    }).join('');
    card.style.display = 'block';
}
function startHintAnim() {
    cancelAnimationFrame(hintRaf);
    const loop = () => { redraw(); hintRaf = requestAnimationFrame(loop); };  // redraw가 마커도 그림
    hintRaf = requestAnimationFrame(loop);
}
function clearHint() {
    if (hintCells.length === 0 && hintRaf === null) return;
    hintCells = [];
    cancelAnimationFrame(hintRaf);
    hintRaf = null;
    const hc = document.getElementById('hintCard');
    if (hc) hc.style.display = 'none';
    redraw();
}

/* ══════════════════════════════════
   형세 판단 / 계가 (집 영역 + 집 차·승률)
══════════════════════════════════ */
function clearEstimate() {
    estOwnership = null;
    const card = document.getElementById('estimateCard');
    if (card) card.style.display = 'none';
}
/* ── 승률 바: 누가 유리한지 한눈에 (흑 기준 승률%·집차) ── */
function setWinrateBar(blackPct, lead) {
    const wrap = document.getElementById('wrBar');
    if (!wrap) return;
    wrap.style.display = '';
    const b = Math.min(99.9, Math.max(0.1, blackPct));
    document.getElementById('wrBarBlack').style.width = b + '%';
    document.getElementById('wrBarBlackLbl').textContent = '흑 ' + b.toFixed(1) + '%';
    document.getElementById('wrBarWhiteLbl').textContent = '백 ' + (100 - b).toFixed(1) + '%';
    const sc = document.getElementById('wrBarScore');
    if (sc) sc.textContent = (lead == null) ? ''
        : (Math.abs(lead) < 0.5 ? '집 차 팽팽' : (lead >= 0 ? '흑' : '백') + ' +' + Math.abs(lead).toFixed(1) + '집');
}
/* 현재 국면 승률을 조용히 갱신(바만) — 착수 때마다 호출해 실시간 유지. estOwnership 은 건드리지 않음 */
function refreshWinrateBar() {
    if (!gameStarted) return;
    fetch('/api/play/estimate', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(r => r.json())
    .then(data => { if (data.ok) setWinrateBar(Math.round((data.winrate || 0) * 1000) / 10, data.scoreLead); })
    .catch(() => {});
}
function requestEstimate(isFinal) {
    if (!gameStarted || waitingForAI) return;
    const btn  = document.getElementById(isFinal ? 'btnScore' : 'btnEstimate');
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = '분석 중...';
    fetch('/api/play/estimate', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(r => r.json())
    .then(data => {
        btn.disabled = false; btn.textContent = orig;
        if (!data.ok) return;
        estOwnership = (data.ownership && data.ownership.length === 361) ? data.ownership : null;
        redraw();
        const lead    = data.scoreLead;               // 흑 기준 집차
        const leadAbs = Math.abs(lead).toFixed(1);
        const leader  = lead >= 0 ? '흑' : '백';
        const wr      = Math.round((data.winrate || 0) * 100);
        setWinrateBar(Math.round((data.winrate || 0) * 1000) / 10, lead);   // 승률 바 갱신
        const card = document.getElementById('estimateCard');
        const lbl  = document.getElementById('estimateLabel');
        const txt  = document.getElementById('estimateText');
        if (isFinal) {
            lbl.textContent = '예상 계가';
            txt.innerHTML = `<span style="font-weight:800;color:#16a085;">${leader} ${leadAbs}집 승</span> <span style="font-size:11px;color:#999;">· 집 예측 기준</span>`;
        } else {
            lbl.textContent = '형세 판단';
            txt.innerHTML = `${leader} <b style="color:#16a085;">+${leadAbs}집</b> 유리 <span style="font-size:12px;color:#666;">· 흑 승률 ${wr}%</span>`;
        }
        card.style.display = '';
    })
    .catch(() => { btn.disabled = false; btn.textContent = orig; });
}
/* 대국 종료(더블 패스) 시 자동 계가 → 종료 카드에 승패 표시 */
function requestFinalScore() {
    const sub = document.getElementById('gameOverSub');
    sub.textContent = '계가 중...';
    fetch('/api/play/estimate', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(r => r.json())
    .then(data => {
        if (!data.ok) { sub.textContent = ''; return; }
        estOwnership = (data.ownership && data.ownership.length === 361) ? data.ownership : null;
        redraw();
        const lead = data.scoreLead;
        const leader = lead >= 0 ? '흑' : '백';
        document.getElementById('gameOverTitle').textContent = '계가 결과';
        sub.textContent = `${leader} ${Math.abs(lead).toFixed(1)}집 승 (집 예측 기준)`;
    })
    .catch(() => { sub.textContent = ''; });
}

/* ══════════════════════════════════
   복기에서 넘어온 국면으로 이어두기
══════════════════════════════════ */
function startReplay(s) {
    userColor = s.userColor;
    // 세팅 국면을 즉시 화면에 반영(응답 대기 전 빈 판 깜빡임 방지)
    history = (s.moves || []).map(p => ({color: p[0], gtp: p[1]}));
    gameStarted = true;
    document.getElementById('setupSection').style.display    = 'none';
    document.getElementById('gameOverSection').style.display = 'none';
    document.getElementById('gameSection').style.display     = '';
    document.getElementById('aiLastCard').style.display      = 'none';
    document.querySelector('.panel-sub').textContent = '복기 ' + s.fromTurn + '수 국면에서 이어 두기';
    setWaiting(true); updateTurnUI(); redraw();

    fetch('/api/play/from', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({userColor: s.userColor, moves: s.moves})
    })
    .then(r => r.json())
    .then(data => {
        setWaiting(false);
        if (!data.ok) { alert('이어두기 오류: ' + data.error); resetToSetup(); return; }
        history = data.history.map(h => ({color: h.color, gtp: h.gtp}));
        blackCaptures = 0; whiteCaptures = 0; isOver = false; lastAiMove = null;
        if (data.aiMove) {
            const aiColor = userColor === 'B' ? 'W' : 'B';
            history.push({color: aiColor, gtp: data.aiMove});
            showAiMove(data.aiMove);
        }
        updateTurnUI(); redraw();
        refreshWinrateBar();   // 이어두기 시작 국면 승률 바
    })
    .catch(err => { setWaiting(false); alert('연결 오류: ' + err); resetToSetup(); });
}

/* ── DOM 준비 후 초기화 ── */
document.addEventListener('DOMContentLoaded', function() {
    computeLayout();
    redraw();
    const pending = sessionStorage.getItem('replaySetup');
    if (pending) {
        sessionStorage.removeItem('replaySetup');
        try { startReplay(JSON.parse(pending)); } catch (e) { console.warn('replay 파싱 실패', e); }
    }
});
</script>
    </main>
</body>
</html>
