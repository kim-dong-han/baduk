<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>실시간 분석판</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        html { height: 100%; }
        /* 셸(body grid) + .main.fill 이 높이를 잡으므로 body 는 배경만 담당 */
        body { margin: 0; padding: 0; height: 100%; background: var(--background); }

        /* 넓을 땐 [판 | 분석패널], 좁아지면 [요약 / 판 / 버튼] 세로 스택.
           패널은 어두운 배경 위에 뜬 둥근 카드 — 화면에 꽉 붙이지 않고 여백을 준다. */
        .play-layout {
            flex: 1; min-height: 0; display: grid; background: var(--sidebar-1);
            grid-template-columns: minmax(0, 1fr) 300px;
            grid-template-rows: minmax(0, 1fr);
            grid-template-areas: "board side";
            gap: 18px; padding: 18px;
        }
        .board-area { grid-area: board; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
        #boardCanvas { display: block; border-radius: 10px; box-shadow: 0 18px 48px -14px rgba(0,0,0,0.8); cursor: pointer; }

        .play-panel {
            grid-area: side; background: var(--surface); border-radius: 16px; overflow-y: auto;
            padding: 18px 16px; box-shadow: 0 14px 36px -14px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 14px;
        }
        .panel-head, .panel-actions { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .panel-title { font-size: 18px; font-weight: 800; color: var(--text-primary); margin: 0 0 4px; }
        .panel-sub   { font-size: 12px; color: var(--text-muted); margin: 0; }

        /* 판 아래 한 줄 안내/상태 — 목록 카드를 없앤 자리 */
        .board-hint {
            margin: 0; font-size: 12px; line-height: 1.6; color: var(--text-muted); text-align: center;
            padding: 9px 11px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border);
        }
        .board-hint.is-busy { color: var(--primary); border-color: var(--primary); }
        .board-hint.is-err  { color: var(--danger);  border-color: var(--danger); }

        .info-card { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; border: 1px solid var(--border); }
        .info-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .info-value { font-size: 15px; font-weight: 700; color: var(--text-primary); }

        .turn-card { border-left: 4px solid var(--primary); display: flex; align-items: center; gap: 10px; }
        .turn-dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
        .turn-dot.black { background: radial-gradient(circle at 35% 32%, #666, #111); }
        .turn-dot.white { background: radial-gradient(circle at 35% 32%, #fff, #ccc); border: 1px solid #bbb; }

        .panel-btn {
            width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
            cursor: pointer; border: none; transition: filter 0.15s, background 0.15s, opacity 0.15s;
        }
        .panel-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary  { background: linear-gradient(135deg, var(--primary), var(--primary-blue)); color: #fff; }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
        .btn-secondary { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border-strong); }
        .btn-secondary:hover:not(:disabled) { background: #e7ebf1; }
        .btn-danger   { background: var(--danger-bg); color: #c0392b; }
        .btn-danger:hover:not(:disabled)  { background: #f1948a; color: #fff; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

        /* 좁아지면 우측 패널을 없애고 [요약 / 판 / 버튼] 으로 쌓는다.
           행 높이를 전부 auto 로 둬야 판이 행에 눌려 잘리지 않는다(예전엔 1fr 이라 위아래가 잘렸음).
           display:contents 로 .play-panel 을 레이아웃에서 지워 자식이 직접 그리드 아이템이 된다. */
        @media (max-width: 1150px) {
            body { overflow: auto; height: auto; min-height: 100%; }
            .play-layout {
                /* flex:1 을 풀어야 그리드가 내용 높이만큼 늘어난다.
                   붙잡아 두면 화면 높이에 맞춰 행이 눌려 판 위아래가 잘린다. */
                flex: none; min-height: 0;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto auto auto;
                grid-template-areas: "head" "board" "actions";
                gap: 14px; padding: 14px;
            }
            .play-panel { display: contents; }
            .panel-head    { grid-area: head; flex-direction: row; flex-wrap: wrap; align-items: stretch; }
            .panel-actions { grid-area: actions; }
            .panel-head, .panel-actions {
                background: var(--surface); border-radius: 14px; padding: 12px;
                box-shadow: 0 12px 28px -14px rgba(0,0,0,0.65);
            }
            .panel-head > * { flex: 1 1 200px; }
            .panel-head .board-hint { flex: 1 1 100%; }
            .panel-intro { display: none; }                    /* 설명문은 숨겨 판 공간 확보 */
            .panel-actions .btn-group { flex-direction: row; flex-wrap: wrap; }
            .panel-actions .panel-btn { flex: 1 1 130px; width: auto; }
        }
    </style>
</head>
<body>

<!-- rail: 좌측 메뉴를 아이콘만 남기고 접는다(호버하면 펼쳐짐) → 그만큼 바둑판이 커진다 -->
    <aside th:replace="~{fragments/shell :: side_rail('study')}"></aside>
    <main class="main fill">
        <header th:replace="~{fragments/shell :: topbar}"></header>
<div class="play-layout">
    <div class="board-area">
        <canvas id="boardCanvas"></canvas>
    </div>

    <div class="play-panel">
      <div class="panel-head">
        <div class="panel-intro">
            <p class="panel-title">🔬 실시간 분석판</p>
            <p class="panel-sub">직접 흑·백을 놓으며 AI 추천수·승률을 실시간 확인</p>
        </div>

        <!-- 다음 차례 -->
        <div class="info-card turn-card">
            <div class="turn-dot black" id="turnDot"></div>
            <div>
                <div class="info-label" style="margin:0;">다음 차례</div>
                <div class="info-value" id="turnText">흑</div>
            </div>
        </div>

        <!-- 현재 형세 (둘 차례 관점) -->
        <div class="info-card" id="standCard" style="border-left:4px solid #16a085;">
            <div class="info-label">현재 형세 · 둘 차례 승률</div>
            <div class="info-value" id="standText" style="margin-top:2px;">-</div>
        </div>

        <!-- 승률 바: 흑·백 누가 유리한지 한눈에 -->
        <div class="info-card" id="wrBar" style="padding:12px 14px;">
            <div class="info-label" style="margin-bottom:8px;">AI 승률 (흑 vs 백)</div>
            <div style="position:relative;height:24px;border-radius:6px;overflow:hidden;display:flex;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);">
                <div id="wrBarBlack" style="height:100%;width:50%;background:linear-gradient(90deg,#2b2b2b,#4a4a4a);transition:width .4s ease;"></div>
                <div style="flex:1;height:100%;background:linear-gradient(90deg,#dcdcdc,#f2f2f2);"></div>
                <span id="wrBarBlackLbl" style="position:absolute;left:8px;top:0;line-height:24px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);">흑 50%</span>
                <span id="wrBarWhiteLbl" style="position:absolute;right:8px;top:0;line-height:24px;font-size:12px;font-weight:700;color:#555;">백 50%</span>
            </div>
            <div id="wrBarScore" style="text-align:center;font-size:12px;color:#888;margin-top:6px;"></div>
        </div>

        <!-- 방금 둔 수 평가 -->
        <div class="info-card" id="lastCard" style="display:none;border-left:4px solid #4a90d9;">
            <div class="info-label">방금 둔 수</div>
            <div id="lastText" style="margin-top:2px;font-size:14px;font-weight:800;">-</div>
        </div>

        <!-- 추천수는 판 위에서 직접 읽는다(원=추천수, 호버=참고도) → 목록 카드 없음 -->
        <p class="board-hint" id="engineState">돌을 놓아보세요</p>
      </div>

      <div class="panel-actions">
        <div class="btn-group">
            <button class="panel-btn btn-secondary" id="btnTerritory" onclick="toggleTerritory()">🏳️ 집 예측 표시: 끔</button>
            <button class="panel-btn btn-secondary" id="btnUndo" onclick="undo()">‹ 무르기 (한 수)</button>
            <button class="panel-btn btn-secondary" id="btnPass" onclick="passTurn()">차례 넘기기 (패스)</button>
            <button class="panel-btn btn-danger" onclick="clearAll()">전체 지우기</button>
        </div>
      </div>
    </div>
</div>

<script th:inline="none">
/* ══ 바둑판 상수 ══ */
let CELL, PAD, BOARD_PX;          // 판 크기는 고정이 아니라 남는 공간에 맞춰 매번 계산
const COLS = 'ABCDEFGHJKLMNOPQRST';
const canvas = document.getElementById('boardCanvas');
const ctx = canvas.getContext('2d');

/* 판을 board-area 의 남는 공간(가로·세로 중 작은 쪽)에 꽉 채운다.
   비트맵과 CSS 크기를 같은 값으로 두어 항상 정사각 → 클릭 좌표가 격자와 정확히 일치.
   화면이 좁아 패널이 판 위·아래로 내려가면 그만큼 가로가 넓어져 판이 자동으로 커진다. */
function computeLayout() {
    const area = document.querySelector('.board-area');
    const stacked = window.matchMedia('(max-width: 1150px)').matches;
    let size;
    if (stacked) {
        // 세로로 쌓인 배치에선 판이 들어갈 행 높이가 판 크기에 의해 정해지므로(행=auto)
        // 행 높이로 재면 순환이 된다 → 가로 폭 기준으로 잡고 화면 높이로만 상한을 둔다.
        size = Math.min(area.clientWidth, window.innerHeight * 0.74);
    } else {
        size = Math.min(area.clientWidth, area.clientHeight);
    }
    size = Math.max(280, Math.min(size, 1000));
    CELL     = Math.floor(size / 20.5);
    PAD      = Math.round(CELL * 1.25);
    BOARD_PX = PAD * 2 + CELL * 18;
    canvas.width        = BOARD_PX;
    canvas.height       = BOARD_PX;
    canvas.style.width  = BOARD_PX + 'px';
    canvas.style.height = BOARD_PX + 'px';
}

/* ══ 상태 ══ */
let stones = [];          // [{x,y,color}] 놓은 순서
let undone = [];          // 무른 수 보관 — 마우스 휠 앞으로가기(다시 두기)용
let nextColor = 'B';      // 다음 착수 색(교대)
let recos = [];           // 추천수 마커 [{gx,gy,cand}] (cand.winrate=흑 기준 0~1)
let recoSide = 'B';       // 추천수 계산한 둘 차례 색
let token = 0;            // 오래된 분석 응답 무시
let prevBest = null;      // 직전 국면의 둘 차례 최선 승률%(방금 둔 수 평가 기준)
let ownership = null;     // 집(영역) 예측 361칸(흑 기준 +흑/−백)
let showTerritory = false;// 집 예측 표시 토글
let candidates = [];      // 이번 응답의 후보수(각 pv 포함) — 참고도 표시용
let hoverPv  = null;      // 판 위 추천수에 마우스를 올렸을 때 보여주는 참고도(LizzieYZY 식)
let hoverIdx = -1;        // 지금 호버 중인 추천수 인덱스(-1=없음)
let lastMoveReco = null;  // 방금 둔 수가 직전 추천수에 있었으면 {gx,gy,wr(둔 쪽 관점 0~1)} — 돌 안에 흐린 승률% 표시

/* ══ 좌표 ══ */
function gridToGtp(x, y) { return COLS[x] + (y + 1); }
function gtpToGrid(gtp) {
    if (!gtp || gtp.toLowerCase() === 'pass') return null;
    let x = gtp[0].toUpperCase().charCodeAt(0) - 65; if (x >= 8) x--;
    const y = parseInt(gtp.substring(1)) - 1;
    if (isNaN(y) || x < 0 || x > 18 || y < 0 || y > 18) return null;
    return { x, y };
}
function px(gx) { return PAD + gx * CELL; }
function py(gy) { return PAD + (18 - gy) * CELL; }

/* ══ 판 그리기 ══ */
function drawBoard() {
    const bg = ctx.createLinearGradient(0, 0, BOARD_PX, BOARD_PX);
    bg.addColorStop(0, '#E8B86D'); bg.addColorStop(1, '#C9954A');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, BOARD_PX, BOARD_PX);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 0.8;
    for (let i = 0; i < 19; i++) {
        ctx.beginPath(); ctx.moveTo(px(i), py(0)); ctx.lineTo(px(i), py(18)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px(0), py(i)); ctx.lineTo(px(18), py(i)); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    [3, 9, 15].forEach(a => [3, 9, 15].forEach(b => { ctx.beginPath(); ctx.arc(px(a), py(b), 3.5, 0, Math.PI * 2); ctx.fill(); }));
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 19; i++) {
        ctx.fillText(COLS[i], px(i), PAD - 14); ctx.fillText(COLS[i], px(i), BOARD_PX - PAD + 14);
        ctx.fillText(String(i + 1), PAD - 15, py(i)); ctx.fillText(String(i + 1), BOARD_PX - PAD + 15, py(i));
    }
}
function drawStone(gx, gy, color, isLast) {
    const cx = px(gx), cy = py(gy), r = CELL * 0.44;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(cx - r * 0.32, cy - r * 0.32, r * 0.08, cx, cy, r);
    if (color === 'B') { g.addColorStop(0, '#555'); g.addColorStop(1, '#000'); }
    else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#cfcfcf'); }
    ctx.fillStyle = g; ctx.fill();
    if (color === 'W') { ctx.strokeStyle = '#999'; ctx.lineWidth = 0.8; ctx.stroke(); }
    if (isLast) { ctx.beginPath(); ctx.arc(cx, cy, r * 0.4, 0, Math.PI * 2); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.stroke(); }
}

/* ══ 추천수 승률 색 마커 ══ */
function winColorHsl(p) { return `hsl(${Math.max(0, Math.min(120, p * 120)).toFixed(0)}, 68%, 44%)`; }
function wrPctI(frac) { return Math.min(99, Math.max(1, Math.round(frac * 100))); }
function wrPct1(frac) { return Math.min(99.9, Math.max(0.1, frac * 100)); }
function drawCandidateHeat(gx, gy, cand, playerColor) {
    const cx = px(gx), cy = py(gy), r = CELL * 0.46;
    const p = playerColor === 'B' ? cand.winrate : (1 - cand.winrate);  // 둘 쪽 관점 승률
    ctx.save();
    ctx.globalAlpha = 0.75; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = winColorHsl(p); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5; ctx.stroke();
    // 소수점 첫째자리까지 표시 → 값 크기로 순위 구분(별도 순위 표시 불필요)
    ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(CELL * 0.27)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(wrPct1(p).toFixed(1) + '%', cx, cy);
    ctx.restore();
}
/* 방금 둔 수가 추천수였으면 그 돌 안에 '금색' 승률%(둔 쪽 관점) — 빨간 착수 표시 대신 이 금색%로 구분. 어떤 돌 색에도 읽히게 어두운 외곽선 */
function drawStoneWinrate(gx, gy, color, wr) {
    const cx = px(gx), cy = py(gy);
    ctx.save();
    ctx.font = `bold ${Math.round(CELL * 0.27)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const txt = wrPct1(wr).toFixed(1) + '%';
    ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.strokeText(txt, cx, cy);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(txt, cx, cy);
    ctx.restore();
}

/* ══ 집(영역) 예측 히트맵 — ownership[(18-gy)*19+gx], +흑/−백. 돌보다 먼저 그려 돌이 덮게 함 ══ */
function drawOwnership() {
    if (!ownership || ownership.length !== 361) return;
    for (let gx = 0; gx < 19; gx++) for (let gy = 0; gy < 19; gy++) {
        const v = ownership[(18 - gy) * 19 + gx];
        if (v == null) continue;
        const a = Math.abs(v); if (a < 0.15) continue;
        const side = CELL * 0.82 * a;
        ctx.fillStyle = v > 0 ? `rgba(0,0,0,${(0.55 * a).toFixed(3)})` : `rgba(255,255,255,${(0.85 * a).toFixed(3)})`;
        ctx.fillRect(px(gx) - side / 2, py(gy) - side / 2, side, side);
    }
}

/* ══ 참고도(예상 진행) 반투명 번호 돌 ══ */
function drawGhostStone(gx, gy, color, num, isFirst) {
    const cx = px(gx), cy = py(gy), r = CELL * 0.44;
    ctx.save(); ctx.globalAlpha = 0.62;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color === 'B' ? '#1a1a1a' : '#f4f4f4'; ctx.fill();
    if (color === 'W') { ctx.strokeStyle = '#999'; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.restore();
    if (isFirst) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.strokeStyle = '#3498db'; ctx.lineWidth = 2.5; ctx.stroke(); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${String(num).length >= 2 ? CELL * 0.34 : CELL * 0.4}px sans-serif`;
    ctx.fillStyle = color === 'B' ? '#fff' : '#222';
    ctx.fillText(String(num), cx, cy);
}
/* 호버 중인 추천수의 예상 진행을 번호 매겨 표시 (startColor부터 교대, 따냄 반영) */
function drawPv() {
    if (!hoverPv) return;
    const shown = hoverPv;
    const board = buildBoard();
    let color = shown.startColor, num = 0;
    for (const gtp of shown.pv) {
        const g = gtpToGrid(gtp);
        if (!g) { color = color === 'B' ? 'W' : 'B'; continue; }
        if (board[g.x][g.y]) { color = color === 'B' ? 'W' : 'B'; continue; }
        board[g.x][g.y] = color;
        const opp = color === 'B' ? 'W' : 'B';
        for (const [nx, ny] of adj(g.x, g.y)) if (board[nx][ny] === opp) { const grp = group(board, nx, ny); if (!hasLiberty(board, grp)) for (const [cx, cy] of grp) board[cx][cy] = null; }
        num++;
        drawGhostStone(g.x, g.y, color, num, num === 1);
        color = color === 'B' ? 'W' : 'B';
    }
}

/* ══ 따냄/자살 규칙 ══ */
function adj(x, y) { const a = []; if (x > 0) a.push([x - 1, y]); if (x < 18) a.push([x + 1, y]); if (y > 0) a.push([x, y - 1]); if (y < 18) a.push([x, y + 1]); return a; }
function group(board, x, y) {
    const color = board[x][y], grp = [], seen = new Set(), st = [[x, y]];
    while (st.length) { const [cx, cy] = st.pop(); const k = cx * 19 + cy; if (seen.has(k)) continue; seen.add(k); grp.push([cx, cy]);
        for (const [nx, ny] of adj(cx, cy)) if (board[nx][ny] === color && !seen.has(nx * 19 + ny)) st.push([nx, ny]); }
    return grp;
}
function hasLiberty(board, grp) { for (const [x, y] of grp) for (const [nx, ny] of adj(x, y)) if (board[nx][ny] === null) return true; return false; }
function buildBoard() {
    const board = Array.from({ length: 19 }, () => Array(19).fill(null));
    for (const s of stones) {
        board[s.x][s.y] = s.color; const opp = s.color === 'B' ? 'W' : 'B';
        for (const [nx, ny] of adj(s.x, s.y)) if (board[nx][ny] === opp) { const grp = group(board, nx, ny); if (!hasLiberty(board, grp)) for (const [gx, gy] of grp) board[gx][gy] = null; }
        const self = group(board, s.x, s.y); if (!hasLiberty(board, self)) for (const [gx, gy] of self) board[gx][gy] = null;
    }
    return board;
}

/* ══ 렌더 ══ */
function render() {
    computeLayout();      // 창 크기·패널 배치가 바뀌었을 수 있으므로 매 렌더마다 판 크기 재계산
    drawBoard();
    if (showTerritory) drawOwnership();
    const board = buildBoard();
    const last = stones.length ? stones[stones.length - 1] : null;
    // 방금 둔 수가 추천수였으면 빨간 착수 표시 대신 금색 % 로 구분(겹침 방지)
    const goldLast = lastMoveReco && last && last.x === lastMoveReco.gx && last.y === lastMoveReco.gy && board[last.x][last.y];
    for (let x = 0; x < 19; x++) for (let y = 0; y < 19; y++) if (board[x][y]) drawStone(x, y, board[x][y], last && x === last.x && y === last.y && !goldLast);
    if (goldLast) drawStoneWinrate(last.x, last.y, last.color, lastMoveReco.wr);
    if (hoverPv) drawPv();                                     // 참고도 보는 중엔 추천수 원 대신 변화도
    else for (const m of recos) if (!board[m.gx][m.gy]) drawCandidateHeat(m.gx, m.gy, m.cand, recoSide);
    document.getElementById('turnText').textContent = nextColor === 'B' ? '흑' : '백';
    const dot = document.getElementById('turnDot'); dot.className = 'turn-dot ' + (nextColor === 'B' ? 'black' : 'white');
    document.getElementById('btnUndo').disabled = stones.length === 0;
    document.getElementById('btnTerritory').textContent = '🏳️ 집 예측 표시: ' + (showTerritory ? '켬' : '끔');
}
/* 판 아래 한 줄 상태 문구(분석 중 / 오류 / 안내) */
function setEngineState(msg, kind) {
    const el = document.getElementById('engineState');
    if (!el) return;
    el.textContent = msg;
    el.className = 'board-hint' + (kind ? ' is-' + kind : '');
}

function toggleTerritory() { showTerritory = !showTerritory; render(); }


/* ══ 착수 ══ */
function mouseToGrid(e) {
    const rect = canvas.getBoundingClientRect();   // 반응형: 가로·세로 배율 각각 적용
    const mx = (e.clientX - rect.left) * (BOARD_PX / rect.width);
    const my = (e.clientY - rect.top)  * (BOARD_PX / rect.height);
    return { gx: Math.round((mx - PAD) / CELL), gy: 18 - Math.round((my - PAD) / CELL) };
}
canvas.addEventListener('click', e => {
    const { gx, gy } = mouseToGrid(e);
    if (gx < 0 || gx > 18 || gy < 0 || gy > 18) return;
    if (buildBoard()[gx][gy]) return;                         // 이미 돌
    stones.push({ x: gx, y: gy, color: nextColor });
    if (buildBoard()[gx][gy] !== nextColor) { stones.pop(); return; }   // 자살수 금지
    undone = [];                                              // 새로 두면 앞으로가기 이력은 무효
    // 방금 둔 수가 현재(둘 차례) 추천수 목록에 있었는지 — 있으면 그 승률(둔 쪽 관점)을 돌 안에 흐리게 표시
    const matched = recos.find(m => m.gx === gx && m.gy === gy);
    lastMoveReco = matched ? { gx, gy, wr: nextColor === 'B' ? matched.cand.winrate : 1 - matched.cand.winrate } : null;
    nextColor = nextColor === 'B' ? 'W' : 'B';
    recos = []; hoverPv = null; hoverIdx = -1; ownership = null;
    render(); analyze();
});
/* 판 위 추천수 원에 마우스를 올리면 그 수의 예상 진행(참고도)을 바로 보여준다.
   LizzieYZY 처럼 목록을 거치지 않고 판에서 바로 변화도를 훑어볼 수 있게. */
canvas.addEventListener('mousemove', e => {
    if (!recos.length) return;
    const { gx, gy } = mouseToGrid(e);
    const idx = recos.findIndex(m => m.gx === gx && m.gy === gy);
    if (idx === hoverIdx) return;                 // 같은 수 위에서 움직이는 중 → 다시 그릴 필요 없음
    hoverIdx = idx;
    const c = idx >= 0 ? recos[idx].cand : null;
    hoverPv = (c && c.pv && c.pv.length) ? { pv: c.pv, startColor: recoSide } : null;
    render();
});
canvas.addEventListener('mouseleave', () => {
    if (hoverIdx === -1) return;
    hoverIdx = -1; hoverPv = null; render();
});

function undo() { if (!stones.length) return; undone.push(stones.pop()); nextColor = nextColor === 'B' ? 'W' : 'B'; recos = []; hoverPv = null; hoverIdx = -1; ownership = null; lastMoveReco = null; render(); analyze(); }
/* 무른 수 다시 두기 — 휠 아래로 굴릴 때 */
function redo() {
    if (!undone.length) return;
    const mv = undone.pop();
    stones.push(mv);
    nextColor = mv.color === 'B' ? 'W' : 'B';
    recos = []; hoverPv = null; hoverIdx = -1; ownership = null; lastMoveReco = null;
    render(); analyze();
}

/* 마우스 휠로 수 되감기·되돌리기 (Lizzie 식: 위로=뒤로, 아래로=앞으로).
   판 위에서만 동작하고 페이지 스크롤은 막는다. 연속 스크롤이 한 번에 여러 수를
   넘기지 않도록 최소 간격을 두고, 매 수마다 KataGo 재분석이 붙으므로 과호출도 막는다. */
let wheelLock = 0;
canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const now = performance.now();
    if (now - wheelLock < 140) return;
    wheelLock = now;
    if (e.deltaY < 0) undo(); else redo();
}, { passive: false });

function passTurn() { nextColor = nextColor === 'B' ? 'W' : 'B'; recos = []; hoverPv = null; hoverIdx = -1; ownership = null; lastMoveReco = null; render(); analyze(); }
function clearAll() {
    stones = []; undone = []; nextColor = 'B'; recos = []; prevBest = null; token++;
    ownership = null; candidates = []; hoverPv = null; hoverIdx = -1; lastMoveReco = null;
    document.getElementById('lastCard').style.display = 'none';
    document.getElementById('standText').textContent = '-';
    setEngineState('돌을 놓아보세요');
    render();
    analyze();
}

/* ══ 실시간 분석 ══ */
function analyze() {
    const my = ++token;
    const moves = stones.map(s => [s.color, gridToGtp(s.x, s.y)]);
    setEngineState('AI가 읽는 중…', 'busy');
    fetch('/api/analyze/top', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ moves }) })
    .then(r => r.json())
    .then(data => {
        if (my !== token) return;                            // 최신 요청만 반영
        if (!data.ok) { setEngineState('분석 실패', 'err'); return; }
        const side = data.sideToMove;                        // 둘 차례
        recoSide = side;
        hoverPv = null; hoverIdx = -1;       // 새 국면 → 참고도 초기화
        ownership = data.ownership || null;                  // 집 예측 361칸(흑 기준)
        candidates = data.candidates || [];                  // pv 포함 후보수(참고도 표시용)
        recos = candidates.map(c => {
            const g = gtpToGrid(c.move); if (!g) return null;
            const sideWr = c.winrate / 100;                  // 둘 차례 관점 0~1
            const blackWr = side === 'B' ? sideWr : 1 - sideWr;
            // pv 도 함께 실어야 판 위 호버만으로 참고도를 그릴 수 있다
            return { gx: g.x, gy: g.y, cand: { move: c.move, winrate: blackWr, pv: c.pv } };
        }).filter(Boolean);
        updateStatus(data);
        render();
        setEngineState('판 위 추천수 원에 마우스를 올리면 예상 진행이 보입니다 · 휠로 수 앞뒤 이동');
    })
    .catch(() => { if (my === token) setEngineState('분석 오류', 'err'); });
}
function clamp(w) { return Math.min(99.9, Math.max(0.1, w)); }
function updateStatus(data) {
    const side = data.sideToMove, sideKr = side === 'B' ? '흑' : '백';
    // 현재 형세: 둘 차례 승률
    const root = clamp(data.rootWinrate);
    let verdict, vcolor;
    if (root >= 60) { verdict = '유리'; vcolor = '#1e8449'; }
    else if (root <= 40) { verdict = '불리'; vcolor = '#c0392b'; }
    else { verdict = '팽팽'; vcolor = '#b7950b'; }
    document.getElementById('standText').innerHTML =
        `<b>${sideKr}</b> 둘 차례 · 승률 <b style="color:${vcolor};">${root.toFixed(0)}%</b> <span style="color:${vcolor};">(${verdict})</span>`;

    // 승률 바(흑 기준) — 둘 차례 승률을 흑 관점으로 변환
    const blackPct = clamp(side === 'B' ? data.rootWinrate : 100 - data.rootWinrate);
    document.getElementById('wrBarBlack').style.width = blackPct + '%';
    document.getElementById('wrBarBlackLbl').textContent = '흑 ' + blackPct.toFixed(1) + '%';
    document.getElementById('wrBarWhiteLbl').textContent = '백 ' + (100 - blackPct).toFixed(1) + '%';
    // 예상 집차(흑 기준 rootScoreLead)
    const lead = data.rootScoreLead;
    document.getElementById('wrBarScore').textContent = (lead == null) ? ''
        : (Math.abs(lead) < 0.5 ? '집 차 팽팽' : (lead >= 0 ? '흑' : '백') + ' +' + Math.abs(lead).toFixed(1) + '집');

    // 방금 둔 수 평가
    const lastCard = document.getElementById('lastCard');
    if (stones.length) {
        const last = stones[stones.length - 1];
        const playerKr = last.color === 'B' ? '흑' : '백';
        const playedWr = clamp(100 - data.rootWinrate);      // 방금 둔 쪽 승률
        let cmp = '';
        if (prevBest != null) {
            const diff = prevBest - playedWr;
            if (diff <= 2) cmp = ` <span style="color:#1e8449;">· 최선급 👍</span>`;
            else if (diff < 8) cmp = ` <span style="color:#b7950b;">· 최선보다 ${diff.toFixed(0)}%p↓</span>`;
            else cmp = ` <span style="color:#c0392b;">· 최선보다 ${diff.toFixed(0)}%p↓ ⚠</span>`;
        }
        document.getElementById('lastText').innerHTML =
            `<b>${gridToGtp(last.x, last.y)}</b> (${playerKr}) → 승률 <b>${playedWr.toFixed(0)}%</b>${cmp}`;
        lastCard.style.display = '';
    } else { lastCard.style.display = 'none'; }

    // 추천수 목록
    prevBest = candidates.length ? clamp(candidates[0].winrate) : null;   // 다음 착수 평가 기준(둘 차례 최선)
}

/* ══ 시작 ══ */
// 창 크기가 바뀌면 판을 다시 재서 그린다(연속 리사이즈는 마지막 한 번만).
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(render, 120); });
// 레일 메뉴가 접히고 펴질 때는 본문 폭이 그대로라 리사이즈가 안 뜨지만,
// 좁은 화면에서 패널이 위·아래로 재배치되는 순간은 잡아야 한다.
window.matchMedia('(max-width: 1150px)').addEventListener('change', render);
render();
analyze();   // 빈 판 분석(흑 첫 수 추천)
</script>
    </main>
