<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>분석 중...</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; margin: 0; padding: 24px 0; background: var(--background); color: var(--text-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; }

        .card { background: var(--surface); border-radius: var(--radius-lg); padding: 36px 40px; text-align: center; box-shadow: var(--shadow-lg); border: 1px solid var(--border); max-width: 500px; width: 92%; }

        .spinner { border: 5px solid var(--primary-light); border-top: 5px solid var(--primary); border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        h2 { font-size: 20px; margin: 0 0 8px; color: var(--text-primary); }
        .filename { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; word-break: break-all; }

        .progress-bar-wrap { background: #e6eaef; border-radius: 99px; height: 12px; margin-bottom: 12px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-blue)); border-radius: 99px; width: 0%; transition: width 0.5s ease; }
        .status-msg { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
        .status-msg #progressPct { color: var(--primary); font-size: 18px; }

        /* 분석 완료 버튼 (DONE 시 표시) */
        .done-box { display: none; margin: 14px 0 2px; }
        .done-btn { display: inline-block; background: #2ecc71; color: #fff; font-size: 15px; font-weight: 700; padding: 11px 22px; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; box-shadow: 0 2px 8px rgba(46,204,113,0.4); }
        .done-btn:hover { background: #27ae60; }

        .divider { border: none; border-top: 1px solid #eee; margin: 22px 0 18px; }

        /* ════════ 사활 위젯 (타이젬 스타일) ════════ */
        .tsume { display: none; }
        .ts-panel { border: 1px solid #e3e7ec; border-radius: 14px; overflow: hidden; box-shadow: 0 3px 14px rgba(0,0,0,0.08); text-align: left; }

        /* 헤더 */
        .ts-header { position: relative; display: flex; align-items: center; justify-content: center; padding: 11px 0; background: linear-gradient(#eaf3fc, #d6e8f8); }
        .ts-h-title { font-size: 16px; font-weight: 800; color: #2c5c88; letter-spacing: 1px; }
        .ts-close { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 16px; color: #6b8bab; cursor: pointer; line-height: 1; padding: 4px 6px; border-radius: 6px; }
        .ts-close:hover { background: rgba(255,255,255,0.6); color: #2c5c88; }

        /* 서브헤더: 오늘의 사활 (n/N) + 차례 */
        .ts-subhead { display: flex; align-items: center; justify-content: space-between; padding: 11px 15px 3px; }
        .ts-sub-left { font-size: 14px; font-weight: 700; color: #3730a3; display: inline-flex; align-items: center; }
        .ts-help { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #cddff0; color: #3730a3; font-size: 11px; font-weight: 700; margin-left: 6px; cursor: help; }
        .ts-turn { font-size: 13px; font-weight: 700; color: #555; display: inline-flex; align-items: center; gap: 6px; }
        .ts-turn-dot { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
        .ts-turn-dot.black { background: #222; box-shadow: inset -2px -2px 3px rgba(255,255,255,0.25); }
        .ts-turn-dot.white { background: #fff; border: 1.5px solid #9aa4ae; }

        /* 난이도 */
        .ts-diff { display: flex; gap: 6px; justify-content: center; padding: 8px 0 12px; }
        .diff-btn { font-size: 12px; color: #777; background: #f0f2f5; border: 1px solid #dde1e6; border-radius: 99px; padding: 4px 14px; cursor: pointer; font-weight: 600; }
        .diff-btn:hover { background: #e6eaee; }
        .diff-btn.active { color: #fff; background: #3730a3; border-color: #3730a3; }

        /* 바둑판 (나무 프레임) */
        .ts-body { padding: 0 15px 14px; text-align: center; }
        .ts-board-wrap { position: relative; display: inline-block; padding: 13px; border-radius: 10px; background: linear-gradient(135deg, #c9a06a, #a97f43); box-shadow: 0 4px 14px rgba(0,0,0,0.25), inset 0 0 0 2px rgba(0,0,0,0.12); }
        #tsumeCanvas { display: block; border-radius: 3px; cursor: pointer; touch-action: manipulation; }
        .ts-board-wrap.dimmed::after { content: ''; position: absolute; inset: 0; border-radius: 10px; background: rgba(24,20,14,0.46); pointer-events: none; }

        /* 정답 축하 오버레이 */
        .ts-correct-ov { position: absolute; inset: 0; border-radius: 10px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: radial-gradient(circle at 50% 42%, rgba(70,58,32,0.5), rgba(18,14,8,0.85)); animation: ovFade .25s ease; }
        .ts-correct-ov.show { display: flex; }
        @keyframes ovFade { from { opacity: 0; } to { opacity: 1; } }
        .ts-correct-text { font-size: 34px; font-weight: 900; color: #ffd23f; letter-spacing: 1px; text-shadow: 0 2px 0 #b8860b, 0 0 18px rgba(255,210,63,0.85); animation: pop .4s cubic-bezier(.2,1.4,.5,1); }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
        .ts-correct-mascot { font-size: 50px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.45)); animation: bob 1.4s ease-in-out infinite; }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        .ts-confirm { background: linear-gradient(#4f46e5, #3730a3); color: #fff; border: none; border-radius: 22px; padding: 9px 32px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(53,122,189,0.55); }
        .ts-confirm:hover { filter: brightness(1.07); }

        /* 완료 도장 */
        .ts-done-stamp { position: absolute; top: 44%; left: 50%; transform: translate(-50%,-50%) rotate(-14deg); display: none; font-size: 30px; font-weight: 900; color: #5b9bd5; border: 4px solid #5b9bd5; border-radius: 12px; padding: 5px 22px; letter-spacing: 6px; opacity: 0.9; background: rgba(255,255,255,0.14); box-shadow: inset 0 0 0 2px rgba(91,155,213,0.35); }
        .ts-done-stamp.show { display: block; animation: stamp .3s cubic-bezier(.2,1.5,.5,1); }
        @keyframes stamp { 0% { transform: translate(-50%,-50%) rotate(-14deg) scale(1.8); opacity: 0; } 100% { transform: translate(-50%,-50%) rotate(-14deg) scale(1); opacity: 0.9; } }

        /* 피드백 + 툴바 */
        .ts-feedback { font-size: 13px; font-weight: 700; min-height: 20px; margin: 12px 0 10px; text-align: center; }
        .fb-correct { color: #1e8449; }
        .fb-wrong   { color: #c0392b; }
        .fb-info    { color: #8a929b; font-weight: 500; }
        .ts-toolbar { display: flex; gap: 8px; justify-content: center; }
        .ts-tb-btn { flex: 1; max-width: 128px; font-size: 13px; color: #4a5560; background: #f4f6f8; border: 1px solid #dfe3e8; border-radius: 10px; padding: 9px 4px; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .ts-tb-btn:hover { background: #e9edf1; }
        .ts-tb-btn.hint { color: #b7770d; background: #fdf3d7; border-color: #f0d98a; }
        .ts-tb-btn.hint:hover { background: #fbecc0; }
        .ts-tb-btn.pulse { color: #fff; background: #3730a3; border-color: #3730a3; box-shadow: 0 0 0 0 rgba(53,122,189,0.5); animation: retryPulse 1.4s ease-out infinite; }
        @keyframes retryPulse { 0% { box-shadow: 0 0 0 0 rgba(53,122,189,0.5); } 70% { box-shadow: 0 0 0 8px rgba(53,122,189,0); } 100% { box-shadow: 0 0 0 0 rgba(53,122,189,0); } }
        .ts-reveal-link { text-align: center; margin-top: 9px; }
        .ts-reveal-link a { font-size: 12px; color: #aab2bd; text-decoration: underline; cursor: pointer; }
        .ts-reveal-link a:hover { color: #777; }

        .sub-msg { font-size: 12px; color: #aaa; margin: 20px 0 14px; }
        .nav-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .nav-link { font-size: 13px; color: #4f46e5; text-decoration: none; padding: 7px 14px; border: 1px solid #4f46e5; border-radius: 8px; }
        .nav-link:hover { background: #4f46e5; color: #fff; }

        .error-state { display: none; }
        .error-state .icon { font-size: 40px; margin-bottom: 16px; }
        .error-msg { font-size: 14px; color: #c0392b; background: #ffe0e0; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <!-- 분석 중 상태 -->
    <div id="runningState">
        <div class="spinner" id="spinner"></div>
        <h2 id="runTitle">KataGo 분석 중...</h2>
        <div class="filename" th:text="${fileName}"></div>
        <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <div class="status-msg"><span id="progressPct">0</span>% 분석됨</div>

        <div class="done-box" id="doneBox">
            <a class="done-btn" id="doneBtn" href="#">✅ 분석 완료 — 결과 보기</a>
        </div>

        <hr class="divider">

        <!-- 사활 위젯 -->
        <div class="tsume" id="tsume">
            <div class="ts-panel">
                <div class="ts-header">
                    <span class="ts-h-title">사활</span>
                    <button class="ts-close" onclick="tsumeClose()" title="닫기">✕</button>
                </div>

                <div class="ts-subhead">
                    <span class="ts-sub-left">오늘의 사활 <b id="tsumeCount">(1/1)</b>
                        <span class="ts-help" title="차례 표시(흑차례/백차례)에서 급소를 찾아, 정해 순서대로 두면 정답입니다. 힌트는 다음 급소를, 정답 보기는 전체 수순을 알려줘요.">?</span>
                    </span>
                    <span class="ts-turn" id="tsumeTurn"><span class="ts-turn-dot black"></span>흑차례</span>
                </div>

                <div class="ts-diff">
                    <button class="diff-btn active" data-diff="쉬움" onclick="setDifficulty(this)">쉬움</button>
                    <button class="diff-btn" data-diff="보통" onclick="setDifficulty(this)">보통</button>
                    <button class="diff-btn" data-diff="어려움" onclick="setDifficulty(this)">어려움</button>
                </div>

                <div class="ts-body">
                    <div class="ts-board-wrap" id="tsumeBoardWrap">
                        <canvas id="tsumeCanvas" width="300" height="300"></canvas>
                        <div class="ts-correct-ov" id="tsumeCorrectOv">
                            <div class="ts-correct-text">정답입니다!</div>
                            <div class="ts-correct-mascot">🐼</div>
                            <button class="ts-confirm" onclick="tsumeConfirm()">확인</button>
                        </div>
                        <div class="ts-done-stamp" id="tsumeDoneStamp">완료</div>
                    </div>

                    <div class="ts-feedback fb-info" id="tsumeFeedback">돌을 놓을 자리를 클릭하세요</div>

                    <div class="ts-toolbar">
                        <button class="ts-tb-btn" onclick="tsumePrev()">‹ 이전 문제</button>
                        <button class="ts-tb-btn hint" onclick="tsumeHint()">🔍 사활 힌트</button>
                        <button class="ts-tb-btn" id="btnRetry" onclick="tsumeRetry()">재도전</button>
                        <button class="ts-tb-btn" onclick="tsumeNext()">다음 문제 ›</button>
                    </div>
                    <div class="ts-reveal-link"><a onclick="tsumeReveal()">정답 보기</a></div>
                </div>
            </div>
        </div>

        <div class="sub-msg">분석하는 동안 사활 문제로 감각을 풀어 보세요</div>
        <div class="nav-links">
            <a class="nav-link" href="/analysis/batch">실력 리포트</a>
            <a class="nav-link" href="/notes">오답노트</a>
            <a class="nav-link" href="/gallery">갤러리</a>
            <a class="nav-link" href="/game">기보 목록</a>
        </div>
    </div>

    <!-- 오류 상태 -->
    <div class="error-state" id="errorState">
        <div class="icon">⚠</div>
        <h2>분석 실패</h2>
        <div class="error-msg" id="errorMsg"></div>
        <div class="nav-links"><a class="nav-link" href="/game">다시 시도</a></div>
    </div>
</div>

<script th:inline="javascript">
    const jobId = [[${jobId}]];

    /* ───────── 분석 진행률 폴링 ───────── */
    let resultUrl = null;
    function setProgress(pct) {
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressPct').textContent = pct;
    }
    function onDone(resultId) {
        setProgress(100);
        resultUrl = '/game/result/' + resultId;
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('runTitle').textContent = '분석 완료!';
        const dbtn = document.getElementById('doneBtn');
        dbtn.href = resultUrl;
        document.getElementById('doneBox').style.display = 'block';
        // 문제 풀던 중일 수 있으니 자동 이동하지 않고 버튼으로 안내
    }
    function poll() {
        fetch('/game/status/' + jobId).then(r => r.json()).then(data => {
            if (data.status === 'DONE') { onDone(data.resultId); }
            else if (data.status === 'ERROR') {
                document.getElementById('runningState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorMsg').textContent = data.error;
            } else if (data.status === 'UNKNOWN') {
                // 서버 재시작 등으로 분석 세션이 사라진 경우 — 무한 로딩 방지
                document.getElementById('runningState').style.display = 'none';
                const es = document.getElementById('errorState');
                es.querySelector('h2').textContent = '분석 정보를 찾을 수 없음';
                document.getElementById('errorMsg').textContent =
                    '이전 분석 세션이 만료되었습니다(서버 재시작 등). 완료된 결과는 결과 목록에서 확인하세요.';
                const link = es.querySelector('.nav-link'); if (link) link.textContent = '결과 목록으로';
                es.style.display = 'block';
            } else {
                setProgress(parseInt(data.progress) || 0);
                setTimeout(poll, 2000);
            }
        }).catch(() => setTimeout(poll, 5000));
    }
    poll();  // 즉시 1회 확인 (완료 상태면 바로 '완료' 표시)
    // 뒤로가기(bfcache)로 복원되면 상태 재확인 — 멈춘 로딩 방지
    window.addEventListener('pageshow', (e) => { if (e.persisted && !resultUrl) poll(); });

    /* ═════════ 사활 위젯 ═════════ */
    const COLS = 'ABCDEFGHJKLMNOPQRST';
    function gtpToGrid(g){ const x = COLS.indexOf(g[0].toUpperCase()); const y = parseInt(g.slice(1)) - 1; return {x, y}; }
    function gridToGtp(x, y){ return COLS[x] + (y + 1); }

    // ── 바둑 기본 규칙: 인접점, 그룹/활로, 착수(따냄·착수금지) ──
    function neighbors(gtp){
        const {x,y} = gtpToGrid(gtp); const sz = (problem && problem.boardSize) || 19; const out = [];
        if (x > 0)      out.push(gridToGtp(x-1, y));
        if (x < sz-1)   out.push(gridToGtp(x+1, y));
        if (y > 0)      out.push(gridToGtp(x, y-1));
        if (y < sz-1)   out.push(gridToGtp(x, y+1));
        return out;
    }
    function groupOf(gtp){
        const color = board[gtp]; const stones = new Set([gtp]); const stack = [gtp]; const libs = new Set();
        while (stack.length){
            for (const n of neighbors(stack.pop())){
                if (!board[n]) libs.add(n);
                else if (board[n] === color && !stones.has(n)) { stones.add(n); stack.push(n); }
            }
        }
        return { stones, libs: libs.size };
    }
    // 돌 놓기 + 따냄/착수금지 처리. 반환 {ok, captured}
    function placeMove(gtp, color){
        board[gtp] = color;
        const opp = color === 'B' ? 'W' : 'B';
        let captured = 0;
        for (const n of neighbors(gtp)){
            if (board[n] === opp){
                const g = groupOf(n);
                if (g.libs === 0){ g.stones.forEach(s => { delete board[s]; captured++; }); }
            }
        }
        if (groupOf(gtp).libs === 0 && captured === 0){ delete board[gtp]; return { ok:false, captured:0 }; } // 착수금지(자살수)
        return { ok:true, captured };
    }

    let problem = null, board = null, finished = false, step = 0;
    let moveNo = 0, moveNums = {};          // 정해 수순 번호 (돌 위에 표기)
    let history = [], histIdx = -1;         // 이전/다음 문제 탐색용
    let currentDifficulty = '쉬움';
    const canvas = document.getElementById('tsumeCanvas');
    const boardWrap = document.getElementById('tsumeBoardWrap');
    const correctOv = document.getElementById('tsumeCorrectOv');
    const doneStamp = document.getElementById('tsumeDoneStamp');
    const btnRetry  = document.getElementById('btnRetry');
    let geom = null; // {xMin,yMin,xMax,yMax,cell,pad,cols,rows}

    function setDifficulty(btn) {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDifficulty = btn.dataset.diff;
        history = []; histIdx = -1;
        fetchNewProblem();
    }

    // 새 랜덤 문제 로드 → history 에 추가
    function fetchNewProblem() {
        let url = '/api/tsumego/random?difficulty=' + encodeURIComponent(currentDifficulty);
        if (problem && problem.id) url += '&exclude=' + encodeURIComponent(problem.id);
        fetch(url).then(r => r.status === 204 ? null : r.json()).then(p => {
            if (!p) { if (histIdx < 0) document.getElementById('tsume').style.display = 'none'; return; }
            history = history.slice(0, histIdx + 1);
            history.push(p); histIdx = history.length - 1;
            renderProblem(p);
        }).catch(() => { if (histIdx < 0) document.getElementById('tsume').style.display = 'none'; });
    }

    // 주어진 문제를 초기 상태로 렌더 (재도전/이전·다음 공용)
    function renderProblem(p) {
        problem = p; finished = false; step = 0; moveNo = 0; moveNums = {};
        document.getElementById('tsume').style.display = 'block';
        // 오버레이/도장 리셋
        correctOv.classList.remove('show');
        doneStamp.classList.remove('show');
        boardWrap.classList.remove('dimmed');
        btnRetry.classList.remove('pulse');
        // 차례 표시
        const tp = p.toPlay || 'B';
        document.getElementById('tsumeTurn').innerHTML =
            (tp === 'W' ? '<span class="ts-turn-dot white"></span>백차례'
                        : '<span class="ts-turn-dot black"></span>흑차례');
        updateCount();
        setFeedback('돌을 놓을 자리를 클릭하세요', 'fb-info');
        // 보드 모델: 초기 배치
        board = {};
        (p.stones || []).forEach(s => board[s.at] = s.color);
        setupGeom();
        draw();
    }
    function updateCount() {
        document.getElementById('tsumeCount').textContent = '(' + (histIdx + 1) + '/' + Math.max(history.length, 1) + ')';
    }

    function tsumePrev() { if (histIdx > 0) { histIdx--; renderProblem(history[histIdx]); } }
    function tsumeNext() { if (histIdx < history.length - 1) { histIdx++; renderProblem(history[histIdx]); } else { fetchNewProblem(); } }
    function tsumeRetry() { if (problem) renderProblem(problem); }
    function tsumeClose() { document.getElementById('tsume').style.display = 'none'; }

    function setupGeom() {
        const r = problem.region && problem.region.length === 4 ? problem.region : [0,0,18,18];
        const [xMin, yMin, xMax, yMax] = r;
        const cols = xMax - xMin + 1, rows = yMax - yMin + 1;
        const target = 300, pad = 22;
        const cell = Math.floor((target - pad * 2) / Math.max(cols, rows));
        const w = pad * 2 + cell * (cols - 1);
        const h = pad * 2 + cell * (rows - 1);
        canvas.width = w; canvas.height = h;
        geom = { xMin, yMin, xMax, yMax, cell, pad, cols, rows };
    }
    function cx(x){ return geom.pad + (x - geom.xMin) * geom.cell; }
    function cy(y){ return geom.pad + (geom.yMax - y) * geom.cell; }

    function draw() {
        const ctx = canvas.getContext('2d');
        const g = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
        g.addColorStop(0,'#E8B86D'); g.addColorStop(1,'#C9954A');
        ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1;
        for (let x = geom.xMin; x <= geom.xMax; x++) { ctx.beginPath(); ctx.moveTo(cx(x), cy(geom.yMax)); ctx.lineTo(cx(x), cy(geom.yMin)); ctx.stroke(); }
        for (let y = geom.yMin; y <= geom.yMax; y++) { ctx.beginPath(); ctx.moveTo(cx(geom.xMin), cy(y)); ctx.lineTo(cx(geom.xMax), cy(y)); ctx.stroke(); }

        // 화점 (반상 크기별)
        const sz = (problem && problem.boardSize) || 19;
        const star = sz >= 19 ? [3,9,15] : sz >= 13 ? [3,6,9] : sz >= 9 ? [2,4,6] : sz >= 7 ? [2,4] : [];
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        star.forEach(sx => star.forEach(sy => {
            if (sx>=geom.xMin&&sx<=geom.xMax&&sy>=geom.yMin&&sy<=geom.yMax) { ctx.beginPath(); ctx.arc(cx(sx),cy(sy),3,0,Math.PI*2); ctx.fill(); }
        }));

        for (const [at, color] of Object.entries(board)) {
            const {x,y} = gtpToGrid(at);
            if (x<geom.xMin||x>geom.xMax||y<geom.yMin||y>geom.yMax) continue;
            drawStone(ctx, x, y, color);
        }
        // 정해 수순 번호
        for (const [at, n] of Object.entries(moveNums)) {
            if (!board[at]) continue;
            const {x,y} = gtpToGrid(at);
            if (x<geom.xMin||x>geom.xMax||y<geom.yMin||y>geom.yMax) continue;
            ctx.fillStyle = board[at]==='B' ? '#fff' : '#222';
            ctx.font = 'bold ' + Math.round(geom.cell*0.5) + 'px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(n, cx(x), cy(y));
        }
    }
    function drawStone(ctx, x, y, color, marker) {
        const px = cx(x), py = cy(y), r = geom.cell * 0.45;
        ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
        const rg = ctx.createRadialGradient(px-r*0.3,py-r*0.3,r*0.1,px,py,r);
        if (color==='B'){ rg.addColorStop(0,'#555'); rg.addColorStop(1,'#000'); ctx.fillStyle=rg; ctx.fill(); }
        else { rg.addColorStop(0,'#fff'); rg.addColorStop(1,'#ccc'); ctx.fillStyle=rg; ctx.fill(); ctx.strokeStyle='#888'; ctx.lineWidth=0.8; ctx.stroke(); }
        if (marker){ ctx.beginPath(); ctx.arc(px,py,r*0.4,0,Math.PI*2); ctx.strokeStyle=marker; ctx.lineWidth=2.5; ctx.stroke(); }
    }
    function markPoint(x, y, color){
        const ctx = canvas.getContext('2d'); const px=cx(x), py=cy(y), r=geom.cell*0.32;
        ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.strokeStyle=color; ctx.lineWidth=3; ctx.stroke();
    }

    function setFeedback(msg, cls){ const el=document.getElementById('tsumeFeedback'); el.textContent=msg; el.className='ts-feedback '+cls; }

    // 정해 수순(짝수 인덱스=내 수, 홀수=상대 응수)
    function curSeq(){ return (problem.solution && problem.solution.length) ? problem.solution : (problem.answers || []); }
    function moveColor(i){ const opp = problem.toPlay === 'B' ? 'W' : 'B'; return (i % 2 === 0) ? problem.toPlay : opp; }

    // 정답 → 축하 오버레이
    function finishSolved(){
        finished = true;
        draw();
        setFeedback('정답입니다! 정해 수순을 확인하세요', 'fb-correct');
        correctOv.classList.add('show');
    }
    // '확인' → 완료 도장 상태
    function tsumeConfirm(){
        correctOv.classList.remove('show');
        boardWrap.classList.add('dimmed');
        doneStamp.classList.add('show');
        btnRetry.classList.add('pulse');
    }
    // 상대 자동 응수(다음 한 수)
    function opponentReply(){
        const seq = curSeq();
        if (step >= seq.length) { finishSolved(); return; }
        const mv = seq[step]; placeMove(mv, moveColor(step)); moveNums[mv] = ++moveNo; step++;
        draw();
        if (step >= seq.length) { finishSolved(); }
        else { setFeedback('좋아요! 다음 수를 두세요', 'fb-info'); }
    }

    canvas.addEventListener('click', (e) => {
        if (!problem || finished) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
        const mx = (e.clientX-rect.left)*scaleX, my = (e.clientY-rect.top)*scaleY;
        // 가장 가까운 교차점
        let best=null, bd=1e9;
        for (let x=geom.xMin;x<=geom.xMax;x++) for (let y=geom.yMin;y<=geom.yMax;y++){
            const d=(cx(x)-mx)**2+(cy(y)-my)**2; if(d<bd){bd=d; best={x,y};}
        }
        if (!best || bd > (geom.cell*0.55)**2) return;
        const gtp = gridToGtp(best.x, best.y);
        if (board[gtp]) return; // 이미 돌 있음

        const seq = curSeq();
        if (gtp === seq[step]) {           // 이번 차례의 정해 수와 일치
            placeMove(gtp, moveColor(step)); moveNums[gtp] = ++moveNo; step++;
            draw(); markPoint(best.x, best.y, '#2ecc71');
            if (step >= seq.length) { finishSolved(); }
            else { setTimeout(opponentReply, 450); }   // 상대가 받아줌
        } else {
            draw(); markPoint(best.x, best.y, '#c0392b');
            setFeedback('아쉬워요, 다시 시도해 보세요', 'fb-wrong');
        }
    });

    function tsumeReveal(){
        if (!problem || finished) return;
        const seq = curSeq();
        for (let i = step; i < seq.length; i++) { placeMove(seq[i], moveColor(i)); moveNums[seq[i]] = ++moveNo; }
        step = seq.length; finished = true; draw();
        setFeedback('정해 수순입니다. 다음 문제에 도전하세요', 'fb-info');
        boardWrap.classList.add('dimmed');
        doneStamp.classList.add('show');
        btnRetry.classList.add('pulse');
    }
    function tsumeHint(){
        if (!problem || finished) return;
        const seq = curSeq(); const a = seq[step]; if(!a) return;
        const {x,y}=gtpToGrid(a); draw(); markPoint(x,y,'rgba(74,144,217,0.8)');
        setFeedback('이 부근이 급소예요', 'fb-info');
    }

    fetchNewProblem();
</script>
