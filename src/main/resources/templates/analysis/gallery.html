<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>샘플 기보 갤러리</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .gal-filters { display:flex; gap:8px; margin-bottom:18px; }
        .gf-btn { border:1px solid var(--border-strong); background:var(--surface); color:var(--text-secondary); font-size:13px; padding:6px 14px; border-radius:var(--radius-pill); cursor:pointer; font-weight:600; transition:all .14s; }
        .gf-btn:hover { background:var(--surface-2); }
        .gf-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }

        .gal-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(248px, 1fr)); gap:var(--gap); }
        .gal-card { background:var(--surface); border-radius:12px; padding:14px 16px; border:1px solid var(--border); display:flex; flex-direction:column; gap:10px; text-decoration:none; color:inherit; transition:border-color .12s; border-top:3px solid var(--accent-purple); }
        .gal-card.mine { border-top-color:var(--primary); }
        .gal-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
        .gal-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
        .gal-title { font-size:14px; font-weight:800; color:var(--text-primary); line-height:1.35; word-break:break-word; }
        .gal-tag { font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--radius-pill); white-space:nowrap; flex-shrink:0; }
        .gal-tag.pro  { background:var(--ai-bg); color:#6b2fce; }
        .gal-tag.mine { background:var(--primary-light); color:var(--primary-dark); }
        .gal-meta { font-size:12px; color:var(--text-muted); }
        .gal-match-lbl { display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
        .gal-match-lbl b { color:var(--text-primary); }
        .gal-track { background:#e6eaef; border-radius:99px; height:8px; overflow:hidden; }
        .gal-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--primary),var(--primary-blue)); }
        .gal-pills { display:flex; gap:6px; flex-wrap:wrap; }
        .gal-pill { font-size:11px; padding:3px 9px; border-radius:var(--radius-pill); background:var(--surface-2); color:var(--text-secondary); }
        .gal-pill.good { background:var(--success-bg); color:#1a8a45; }
        .gal-pill.warn { background:var(--warning-bg); color:#b5770a; }
        .gal-pill.bad  { background:var(--danger-bg); color:#c62828; }
        .gal-foot { font-size:12px; color:var(--accent-purple); font-weight:700; margin-top:auto; }
        .gal-card.mine .gal-foot { color:var(--primary); }
        .empty { color:var(--text-muted); text-align:center; padding:44px; background:var(--surface); border-radius:12px; border:1px solid var(--border); }
    </style>
</head>
<body>
    <aside th:replace="~{fragments/shell :: side('gallery')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/shell :: topbar}"></header>
<div class="page">
    <h1>샘플 기보 갤러리</h1>
    <p class="subtitle">KataGo로 분석한 기보 모음이에요. 카드를 누르면 상세 복기로 이동합니다.</p>

    <div class="gal-filters" th:if="${not #lists.isEmpty(items)}">
        <button class="gf-btn active" data-f="all" onclick="galFilter(this)">전체</button>
        <button class="gf-btn" data-f="pro" onclick="galFilter(this)">프로 기보</button>
        <button class="gf-btn" data-f="mine" onclick="galFilter(this)">내 기보</button>
    </div>

    <p th:if="${#lists.isEmpty(items)}" class="empty">아직 분석된 기보가 없어요. 기보를 복기하면 여기에 모입니다.</p>

    <div class="gal-grid" id="galGrid">
        <a th:each="it : ${items}"
           th:href="'/game/result/' + ${it.id}"
           th:classappend="${it.pro ? '' : 'mine'}"
           class="gal-card" th:attr="data-pro=${it.pro}">
            <div class="gal-top">
                <div class="gal-title" th:text="${it.title}">제목</div>
                <span th:class="${it.pro ? 'gal-tag pro' : 'gal-tag mine'}" th:text="${it.pro ? '프로' : '내 기보'}">태그</span>
            </div>
            <div class="gal-meta">
                <span th:text="${it.dateText}"></span> · <span th:text="${it.totalMoves} + '수'"></span>
            </div>
            <div>
                <div class="gal-match-lbl"><span>전체 AI 유사도</span><b th:text="${it.matchRate} + '%'"></b></div>
                <div class="gal-track"><div class="gal-fill" th:style="'width:' + ${it.matchRate} + '%'"></div></div>
            </div>
            <div class="gal-pills">
                <span th:if="${it.openingLoss > 0 or it.middleLoss > 0 or it.endgameLoss > 0}"
                      th:class="${it.openingLoss < 1.5 ? 'gal-pill good' : (it.openingLoss < 3 ? 'gal-pill warn' : 'gal-pill bad')}"
                      th:text="'초반 ' + ${it.openingLoss} + '집'"></span>
                <span th:if="${it.middleLoss > 0}"
                      th:class="${it.middleLoss < 1.5 ? 'gal-pill good' : (it.middleLoss < 3 ? 'gal-pill warn' : 'gal-pill bad')}"
                      th:text="'중반 ' + ${it.middleLoss} + '집'"></span>
                <span th:if="${it.endgameLoss > 0}"
                      th:class="${it.endgameLoss < 1.5 ? 'gal-pill good' : (it.endgameLoss < 3 ? 'gal-pill warn' : 'gal-pill bad')}"
                      th:text="'종반 ' + ${it.endgameLoss} + '집'"></span>
            </div>
            <div class="gal-foot">복기 보기 →</div>
        </a>
    </div>
    </div>

    <script>
    function galFilter(btn) {
        document.querySelectorAll('.gf-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        const f = btn.dataset.f;
        document.querySelectorAll('.gal-card').forEach(function(c){
            const isPro = c.dataset.pro === 'true';
            const show = f === 'all' || (f === 'pro' && isPro) || (f === 'mine' && !isPro);
            c.style.display = show ? '' : 'none';
        });
    }
    </script>
    </main>
</body>
</html>
