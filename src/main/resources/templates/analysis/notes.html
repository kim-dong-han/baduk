<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오답노트</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .notes-head { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px; }
        .notes-stat { font-size:13px; color:var(--text-secondary); }
        .notes-stat b { color:var(--text-primary); }
        .note-filters { display:flex; gap:8px; }
        .nf-btn { border:1px solid var(--border-strong); background:var(--surface); color:var(--text-secondary); font-size:13px; padding:6px 14px; border-radius:var(--radius-pill); cursor:pointer; font-weight:600; transition:all .14s; }
        .nf-btn:hover { background:var(--surface-2); }
        .nf-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }

        .note-grid { display:flex; flex-direction:column; gap:8px; }
        .note-card { background:var(--surface); border-radius:12px; padding:12px 16px; border:1px solid var(--border); display:flex; align-items:center; gap:14px; border-left:3px solid var(--warning); }
        .note-card.g-악수 { border-left-color:var(--danger); }
        .note-loss { text-align:center; min-width:70px; }
        .note-loss-num { font-size:21px; font-weight:800; color:var(--danger); line-height:1; }
        .note-loss-lbl { font-size:11px; color:var(--text-muted); margin-top:3px; }
        .note-body { flex:1; min-width:0; }
        .note-line1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
        .note-badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--radius-pill); }
        .note-badge.실수 { background:var(--warning-bg); color:#b5770a; }
        .note-badge.악수 { background:var(--danger-bg); color:#c62828; }
        .note-move { font-size:14px; font-weight:700; color:var(--text-primary); }
        .note-move .arrow { color:var(--text-muted); font-weight:400; margin:0 4px; }
        .note-move .best { color:var(--primary-blue); }
        .note-phase { font-size:11px; color:var(--text-secondary); background:var(--surface-2); padding:2px 8px; border-radius:var(--radius-pill); }
        .note-stone { display:inline-block; width:12px; height:12px; border-radius:50%; vertical-align:middle; }
        .note-stone.B { background:#222; }
        .note-stone.W { background:#fff; border:1px solid #bbb; }
        .note-game { font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .note-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
        .note-bookmark { font-size:20px; cursor:pointer; color:#d6dce3; user-select:none; background:none; border:none; padding:2px; line-height:1; }
        .note-bookmark.on { color:#f1c40f; }
        .note-open { font-size:13px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary-blue)); padding:8px 13px; border-radius:var(--radius-sm); text-decoration:none; white-space:nowrap; box-shadow:0 6px 14px -8px rgba(79,70,229,0.6); }
        .note-open:hover { filter:brightness(1.05); }
        .empty { color:var(--text-muted); text-align:center; padding:50px; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); }
        @media (max-width:640px){ .note-card{ flex-wrap:wrap; } .note-actions{ width:100%; justify-content:flex-end; } }
    </style>
</head>
<body>
    <aside th:replace="~{fragments/shell :: side('notes')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/shell :: topbar}"></header>
<div class="page">
    <h1>오답노트</h1>
    <p class="subtitle">내 기보에서 실수·악수로 분류된 수를 모았어요. ⭐를 눌러 다시 볼 수를 북마크하세요.</p>

    <script th:inline="javascript">
        const notesData = /*[[${notes}]]*/ [];
    </script>

    <div id="notes-root"></div>

    <script>
    (function() {
        const BM_KEY = 'badukNoteBookmarks';
        function loadBookmarks() {
            try { return new Set(JSON.parse(localStorage.getItem(BM_KEY) || '[]')); }
            catch(e) { return new Set(); }
        }
        function saveBookmarks(set) { localStorage.setItem(BM_KEY, JSON.stringify([...set])); }
        let bookmarks = loadBookmarks();
        let filter = 'all';   // all | bookmark | blunder

        const root = document.getElementById('notes-root');
        function noteKey(n) { return n.gameId + ':' + n.turnNumber; }

        function visible(n) {
            if (filter === 'bookmark') return bookmarks.has(noteKey(n));
            if (filter === 'blunder')  return n.grade === '악수';
            return true;
        }

        function render() {
            if (!notesData || notesData.length === 0) {
                root.innerHTML = '<div class="empty">아직 오답이 없어요.<br>기보를 복기하면 실수·악수가 여기에 모입니다.</div>';
                return;
            }
            const shown = notesData.filter(visible);
            const bmCount = notesData.filter(n => bookmarks.has(noteKey(n))).length;

            let html = '<div class="notes-head">'
                + '<div class="notes-stat">총 <b>' + notesData.length + '</b>개 · 북마크 <b>' + bmCount + '</b>개'
                + (filter !== 'all' ? ' · 표시 <b>' + shown.length + '</b>개' : '') + '</div>'
                + '<div class="note-filters">'
                + '<button class="nf-btn ' + (filter==='all'?'active':'') + '" data-f="all">전체</button>'
                + '<button class="nf-btn ' + (filter==='blunder'?'active':'') + '" data-f="blunder">악수만</button>'
                + '<button class="nf-btn ' + (filter==='bookmark'?'active':'') + '" data-f="bookmark">⭐ 북마크</button>'
                + '</div></div>';

            if (shown.length === 0) {
                html += '<div class="empty">' + (filter==='bookmark' ? '북마크한 수가 없어요. ⭐로 표시해 보세요.' : '해당하는 수가 없어요.') + '</div>';
            } else {
                html += '<div class="note-grid">' + shown.map(function(n) {
                    const key = noteKey(n);
                    const on = bookmarks.has(key);
                    const gameName = (n.fileName || '기보').replace(/\.(gib|sgf)$/i, '');
                    const best = n.bestMove && n.bestMove !== n.move
                        ? '<span class="arrow">→</span><span class="best">' + n.bestMove + '</span>' : '';
                    return '<div class="note-card g-' + n.grade + '">'
                        + '<div class="note-loss"><div class="note-loss-num">-' + n.scoreLoss + '</div><div class="note-loss-lbl">집 손해</div></div>'
                        + '<div class="note-body">'
                        + '<div class="note-line1">'
                        + '<span class="note-badge ' + n.grade + '">' + n.grade + '</span>'
                        + '<span class="note-stone ' + n.color + '"></span>'
                        + '<span class="note-move">' + n.turnNumber + '수 · ' + n.move + best + '</span>'
                        + '<span class="note-phase">' + (n.phase || '') + '</span>'
                        + '</div>'
                        + '<div class="note-game">' + gameName + '</div>'
                        + '</div>'
                        + '<div class="note-actions">'
                        + '<button class="note-bookmark ' + (on?'on':'') + '" data-key="' + key + '" title="북마크">' + (on?'★':'☆') + '</button>'
                        + '<a class="note-open" href="/game/result/' + n.gameId + '?move=' + n.turnNumber + '">복기에서 보기</a>'
                        + '</div></div>';
                }).join('') + '</div>';
            }
            root.innerHTML = html;

            root.querySelectorAll('.nf-btn').forEach(function(b) {
                b.addEventListener('click', function() { filter = b.dataset.f; render(); });
            });
            root.querySelectorAll('.note-bookmark').forEach(function(b) {
                b.addEventListener('click', function() {
                    const k = b.dataset.key;
                    if (bookmarks.has(k)) bookmarks.delete(k); else bookmarks.add(k);
                    saveBookmarks(bookmarks);
                    render();
                });
            });
        }
        render();
    })();
    </script>
    </div>
    </main>
</body>
</html>
